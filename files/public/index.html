        ${slot(opp,false)}
      </div>
      <div class="lobby-actions">
        <span class="conn-pill ${online.conn}" id="conn-pill">${connLabel(online.conn)}</span>
        <button class="btn primary big" id="lobby-ready" ${opp&&opp.connected?'':'disabled'}>${me&&me.ready?'CANCEL READY':'READY UP'}</button>
      </div>
    </div>`;
  dom.lobby.querySelector('#lobby-back').onclick=()=>{ leaveOnline(); openFriendSetup(); };
  const copy=dom.lobby.querySelector('#rc-copy'); if(copy) copy.onclick=()=>{ copyText(code); toast('Code copied'); };
  const link=dom.lobby.querySelector('#rc-link'); if(link) link.onclick=()=>{ copyText(location.origin+'/join/'+code); toast('Invite link copied'); };
  const rdy=dom.lobby.querySelector('#lobby-ready'); if(rdy) rdy.onclick=()=>{ const willReady=!(me&&me.ready); online.session.ready(willReady); audio.sfx('ui'); };
}

function connLabel(s){ return ({connecting:'Connecting…',online:'Connected',reconnecting:'Reconnecting…','opponent-gone':'Opponent dropped — waiting…','opponent-back':'Opponent back','opponent-left':'Opponent left',error:'Connection error'})[s]||s; }
function copyText(t){ try{ navigator.clipboard.writeText(t); }catch(e){ const ta=el('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); } }
function leaveOnline(){ if(online&&online.session) online.session.close(); online=null; session=null; }

function withPerspective(snapshot){ return snapshot; } // server already sets humanSide per-player

/* ---- the reactive online match controller ---- */
function onlineHandlers(){
  return {
    connection:(s)=>{ if(online){ online.conn=s; const pill=document.getElementById('conn-pill'); if(pill){ pill.className='conn-pill '+s; pill.textContent=connLabel(s);} } if(s==='opponent-left'){ toast('Opponent left the match.'); } },
    lobbyCode:(c)=>{ if(dom.lobby.classList.contains('on')) renderLobby(); },
    lobby:(view)=>{ if(!online) return; online.lobby=view; if(!online.started) renderLobby(); },
    joinError:(err)=>{ const e=document.getElementById('join-err'); if(e){ e.textContent=err; } else toast(err); },
    matchStart:(p)=>{
      online.started=true;
      state = withPerspective(p.snapshot);
      dom.result.className='result'; dom.result.innerHTML='';
      buildMatchDOM(); syncBoard(); updateHud(); renderLog();
      setScreen('match'); audio.start(); audio.music('battle');
      humanActive=false; updateHud();
      banner(p.resumed?'Reconnected':'The Rift Opens'); 
    },
    round:async (p)=>{ state=withPerspective(p.snapshot); renderHand(); syncBoard(); updateHud(); renderLog(); banner('Round '+p.round); if(p.fx&&p.fx.length) await playFx(p.fx); renderHand(); syncBoard(); updateHud(); },
    phase:(p)=>{
      state=withPerspective(p.snapshot);
      const mySide=online.session.mySide();
      controller.phaseLabel = p.yourTurn ? phaseTitle(p.label,true) : phaseTitle(p.label,false);
      if(p.yourTurn){
        humanActive=true;
        phaseMode = p.label==='v-setup'?'main' : (p.label==='v-tricks'?'tricks':'full');
        selectedIid=null; powerArmed=false;
        dom.endbtn.textContent = p.label==='v-setup'?'Pass to Rival ▶' : (p.label==='v-tricks'?'GO! ⚔':'End Turn');
        banner(phaseTitle(p.label,true));
      } else {
        humanActive=false; selectedIid=null; powerArmed=false;
        banner("Opponent's "+phaseTitle(p.label,false));
      }
      renderHand(); syncBoard(); updateHud();
    },
    fx:async (p)=>{ const fxl=p.fx||[]; if(fxl.length) await playFx(fxl); state=withPerspective(p.snapshot); renderHand(); syncBoard(); updateHud(); renderLog(); },
    combat:async (p)=>{ controller.phaseLabel='CLASH'; updateHud(); banner('Clash!'); audio.sfx('combat'); await delay(reduceMotion?40:420); const fxl=p.fx||[]; if(fxl.length) await playFx(fxl); state=withPerspective(p.snapshot); syncBoard(); updateHud(); renderLog(); },
    matchEnd:(p)=>{ state=withPerspective(p.snapshot); humanActive=false; showOnlineResult(p); },
    error:(err)=>{ toast(err); }
  };
}
function phaseTitle(label, mine){
  if(label==='v-setup') return mine?'Your Setup':'Setup';
  if(label==='v-tricks') return mine?'Your Tricks':'Tricks';
  if(label==='r-full') return mine?'Your Turn':'Turn';
  return mine?'Your Turn':'Turn';
}
function showOnlineResult(p){
  const win=p.youWon, draw=p.draw;
  dom.result.className='result on '+(win?'win':'loss');
  dom.result.innerHTML=`
    <div class="panel">
      <h2>${draw?'DRAW':win?'VICTORY':'DEFEAT'}</h2>
      <p>${draw?'Both crystals shattered at once.':win?'You cracked the rival crystal.':'Your crystal shattered.'}</p>
      <button class="btn primary" id="result-menu">Main Menu</button>
    </div>`;
  if(typeof confetti==='function' && win){ try{ fx.confetti(); }catch(e){} }
  dom.result.querySelector('#result-menu').onclick=()=>{ leaveOnline(); renderMenu(); setScreen('menu'); audio.music('menu'); };
}

/* If the page was opened via an invite link, jump straight toward joining. */
function maybeAutoJoin(){
  if(!pendingJoinCode) return;
  toast('Joining room '+pendingJoinCode+' — pick your hero & deck');
  openFriendSetup();
}

maybeAutoJoin();

})();
</script>
