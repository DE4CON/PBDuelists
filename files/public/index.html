<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prismbreak Duelists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,400;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PRISMBREAK DUELISTS — design system
   ============================================================ */
:root{
  color-scheme: dark;
  --font-display: "Lilita One", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;

  --ink:        #0a0f1f;
  --ink-2:      #111a30;
  --rift-top:   #1a1146;
  --rift-mid:   #0e1b3a;
  --rift-low:   #071326;

  --glass:      rgba(20,28,52,.66);
  --glass-2:    rgba(30,42,74,.72);
  --line:       rgba(150,190,255,.18);
  --line-2:     rgba(150,190,255,.32);

  --text:       #eaf2ff;
  --muted:      #9fb2d6;
  --dim:        #6f82a8;

  --gold:       #ffd05a;
  --amber:      #ffb02e;
  --blade:      #ffcf5c;
  --hp:         #ff5d6c;
  --teal:       #3fe0d0;
  --cyan:       #57c8ff;
  --violet:     #b388ff;
  --green:      #6fe27a;
  --coral:      #ff7a59;

  /* faction hues */
  --h-ember: 14;
  --h-dawn:  44;
  --h-flux:  128;
  --h-null:  268;
  --h-sky:   202;
  --h-prism: 320;

  --shadow-card: 0 14px 28px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.4);
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 9px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; margin:0; }
body{
  font-family: var(--font-body);
  color: var(--text);
  background: var(--ink);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; }
button:disabled{ cursor:default; }
svg{ display:block; }

/* ---------- root layers ---------- */
#bg, #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
#bg{ z-index:0; }
#fx{ z-index:60; }
#fxdom{ position:fixed; inset:0; z-index:61; pointer-events:none; overflow:hidden; }

#shake{ position:fixed; inset:0; z-index:10; will-change:transform; }
#game{ position:relative; height:100%; }

.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden; transform:translateY(10px) scale(.995);
  transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.3,1), visibility .4s;
  overflow:hidden;
}
.screen.on{ opacity:1; visibility:visible; transform:none; }
.screen:not(#screen-match){ display:grid; place-items:center; overflow-y:auto; }

/* ============================================================
   MENU
   ============================================================ */
#screen-menu{ align-items:center; justify-content:center; padding:24px; text-align:center; }
.menu-inner{ width:min(960px,94vw); display:flex; flex-direction:column; align-items:center; gap:26px; }

.logo{ position:relative; }
.logo h1{
  font-family:var(--font-display);
  margin:0; line-height:.86;
  font-size: clamp(46px, 9vw, 104px);
  letter-spacing:.5px;
  background: linear-gradient(180deg,#fff 0%, #cfe6ff 38%, #6db6ff 64%, #3a6cff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 10px 26px rgba(72,140,255,.55));
}
.logo .sub{
  font-family:var(--font-display);
  letter-spacing:9px; font-size:clamp(13px,2.4vw,20px);
  color:var(--gold);
  text-shadow:0 2px 0 rgba(0,0,0,.4);
  margin-top:2px;
}
.logo .shard{
  position:absolute; width:14px;height:14px; border-radius:3px;
  background:linear-gradient(135deg,#fff,#6db6ff);
  box-shadow:0 0 18px #6db6ff; transform:rotate(45deg);
  animation: floaty 4s ease-in-out infinite;
}
.tagline{ color:var(--muted); max-width:46ch; font-weight:700; font-size:15px; margin-top:-8px; }

.hero-select{ width:100%; }
.hero-select .label{
  font-family:var(--font-display); letter-spacing:3px; color:var(--muted);
  font-size:13px; margin-bottom:12px;
}
.hero-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.role-select{ margin-top:6px; }
.role-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.role-pick{ display:flex; flex-direction:column; gap:2px; padding:11px 18px; border-radius:var(--r-md);
  background:var(--glass-2); border:1px solid var(--line); min-width:200px; transition:transform .15s, border-color .15s, box-shadow .15s; cursor:pointer; }
.role-pick:hover{ transform:translateY(-3px); border-color:var(--line-2); }
.role-pick strong{ font-family:var(--font-display); font-size:16px; letter-spacing:.4px; }
.role-pick small{ color:var(--muted); font-size:11.5px; font-weight:800; }
.role-pick.sel{ border-color:rgba(120,255,210,.7); box-shadow:0 0 0 1px rgba(120,255,210,.5), 0 10px 26px rgba(0,0,0,.4); background:linear-gradient(160deg, rgba(63,224,208,.16), var(--glass-2)); }
.role-pick.sel strong{ color:#bff8f1; }
.hero-pick{
  position:relative; width:150px; padding:16px 12px 14px;
  border-radius:var(--r-md);
  background:
    radial-gradient(120% 80% at 50% -10%, hsla(var(--hue),80%,60%,.30), transparent 60%),
    var(--glass);
  border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  transition: transform .22s cubic-bezier(.2,.9,.3,1.4), box-shadow .22s, border-color .22s;
  overflow:hidden;
}
.hero-pick:hover{ transform: translateY(-8px) scale(1.03); border-color:hsla(var(--hue),85%,65%,.8); box-shadow:0 18px 40px hsla(var(--hue),80%,40%,.4); }
.hero-pick.sel{ border-color:hsla(var(--hue),90%,68%,.95); box-shadow:0 0 0 2px hsla(var(--hue),90%,65%,.6), 0 18px 44px hsla(var(--hue),80%,42%,.55); }
.hero-pick .ring{
  width:78px;height:78px;border-radius:50%;
  background: radial-gradient(circle at 40% 32%, hsla(var(--hue),90%,72%,1), hsla(var(--hue),70%,42%,1) 70%);
  box-shadow: inset 0 -6px 14px rgba(0,0,0,.4), 0 6px 16px hsla(var(--hue),70%,30%,.6);
  display:grid; place-items:center;
}
.hero-pick .ring svg{ width:58px;height:58px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.hero-pick .hname{ font-family:var(--font-display); font-size:17px; letter-spacing:.3px; }
.hero-pick .htitle{ font-size:11.5px; color:var(--muted); font-weight:800; margin-top:-4px; }
.hero-pick .hfac{ display:flex; gap:5px; }
.hero-pick .dot{ width:9px;height:9px;border-radius:50%; box-shadow:0 0 6px rgba(0,0,0,.4) inset; }

.modes{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.mode{
  position:relative; width:178px; padding:16px; border-radius:var(--r-md);
  background: var(--glass-2); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  transition: transform .2s cubic-bezier(.2,.9,.3,1.4), box-shadow .2s, border-color .2s;
}
.mode:hover{ transform:translateY(-6px); border-color:var(--line-2); box-shadow:0 16px 34px rgba(0,0,0,.5); }
.mode .mi{ width:42px;height:42px; display:grid;place-items:center; border-radius:12px; background:rgba(255,255,255,.06); margin-bottom:2px; }
.mode .mi svg{ width:26px;height:26px; }
.mode strong{ font-family:var(--font-display); font-size:18px; letter-spacing:.4px; }
.mode small{ color:var(--muted); font-size:12px; font-weight:800; }
.mode.play{ background:linear-gradient(160deg, rgba(63,224,208,.22), var(--glass-2)); border-color:rgba(63,224,208,.4); }
.mode.play strong{ color:#bff8f1; }

.menu-foot{ color:var(--dim); font-size:12px; font-weight:800; letter-spacing:.4px; }
.menu-foot b{ color:var(--muted); }

/* ---------- HOME ---------- */
.menu-inner.home{ gap:30px; }
.logo.big h1{ font-size:clamp(46px,8vw,84px); }
.home-actions{ display:flex; flex-direction:column; gap:14px; width:min(420px,90vw); }
.bigbtn{ position:relative; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; column-gap:16px; align-items:center;
  padding:18px 26px; border-radius:18px; text-align:left; cursor:pointer; overflow:hidden;
  border:1px solid var(--line); background:var(--glass-2);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.4), box-shadow .18s, border-color .18s, background .18s; }
.bigbtn .bb-icon{ grid-row:1/3; width:48px;height:48px; display:grid;place-items:center; border-radius:14px; background:rgba(255,255,255,.08); font-size:26px; font-weight:900; }
.bigbtn .bb-icon svg{ width:30px;height:30px; }
.bigbtn .bb-main{ font-family:var(--font-display); font-size:24px; letter-spacing:.6px; line-height:1; }
.bigbtn .bb-sub{ color:var(--muted); font-size:12.5px; font-weight:800; }
.bigbtn:hover{ transform:translateY(-4px); box-shadow:0 18px 40px rgba(0,0,0,.5); border-color:var(--line-2); }
.bigbtn:active{ transform:translateY(-1px) scale(.99); }
.bigbtn.primary{ background:linear-gradient(135deg, rgba(63,224,208,.32), rgba(40,167,255,.18)); border-color:rgba(63,224,208,.6); box-shadow:0 10px 30px rgba(40,180,200,.25); }
.bigbtn.primary .bb-main{ color:#d4fff8; }
.bigbtn.primary .bb-icon{ background:rgba(63,224,208,.25); }
.bigbtn.primary::after{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,.13) 50%, transparent 60%); transform:translateX(-120%); }
.bigbtn.primary:hover::after{ animation: sheen 1s ease; }
@keyframes sheen{ to{ transform:translateX(120%); } }

/* ---------- PRE-BATTLE SETUP ---------- */
.setup-inner{ width:min(1080px,96vw); margin:0 auto; height:100%; display:flex; flex-direction:column; padding:14px clamp(8px,2vw,20px); gap:12px; }
.setup-top{ display:flex; align-items:center; gap:12px; }
.setup-title{ flex:1; text-align:center; font-family:var(--font-display); font-size:clamp(20px,3vw,30px); letter-spacing:2px; color:#eaf2ff; }
.setup-spacer{ width:46px; }
.iconbtn{ width:46px;height:46px; border-radius:14px; background:var(--glass-2); border:1px solid var(--line); font-size:24px; font-weight:900; color:#cdd8ee; cursor:pointer; transition:transform .15s, background .15s, border-color .15s; }
.iconbtn:hover{ transform:translateX(-2px); background:var(--glass); border-color:var(--line-2); }
.setup-cols{ flex:1; display:grid; grid-template-columns: 1fr 1.05fr; gap:18px; min-height:0; }
.sec-label{ font-family:var(--font-display); font-size:12.5px; letter-spacing:2px; color:var(--muted); margin:2px 0 8px; }
.setup-left, .setup-right{ overflow-y:auto; padding:2px 4px; min-height:0; }
.setup-right{ display:flex; flex-direction:column; }

.herocard-list{ display:flex; flex-direction:column; gap:10px; }
.herocard{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:16px; text-align:left; cursor:pointer;
  background:linear-gradient(120deg, hsla(var(--hue),45%,24%,.4), var(--glass-2)); border:1px solid var(--line);
  transition: transform .16s cubic-bezier(.2,.9,.3,1.3), border-color .16s, box-shadow .16s; }
.herocard:hover{ transform:translateX(4px); border-color:hsla(var(--hue),80%,62%,.7); box-shadow:0 10px 26px hsla(var(--hue),70%,30%,.4); }
.herocard.sel{ border-color:hsla(var(--hue),90%,66%,.95); box-shadow:0 0 0 2px hsla(var(--hue),90%,64%,.55), 0 12px 30px hsla(var(--hue),75%,35%,.5); background:linear-gradient(120deg, hsla(var(--hue),55%,30%,.6), var(--glass-2)); }
.hc-portrait{ width:56px;height:56px;flex:0 0 auto; display:grid;place-items:center; border-radius:50%; background:radial-gradient(circle at 38% 32%, hsla(var(--hue),70%,55%,.6), hsla(var(--hue),60%,22%,.7)); border:2px solid hsla(var(--hue),80%,60%,.6); }
.hc-portrait svg{ width:40px;height:40px; }
.hc-body{ flex:1; min-width:0; }
.hc-namerow{ display:flex; align-items:center; gap:8px; }
.hc-name{ font-family:var(--font-display); font-size:17px; }
.hc-title{ font-size:11.5px; color:var(--muted); font-weight:800; }
.hc-facs{ display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; }
.fac-chip{ font-size:10px; font-weight:900; letter-spacing:.4px; padding:2px 8px; border-radius:999px; color:hsla(var(--fc),90%,82%,1); background:hsla(var(--fc),70%,40%,.22); border:1px solid hsla(var(--fc),80%,60%,.4); }
.diff{ font-size:10px; font-weight:900; letter-spacing:.5px; padding:2px 9px; border-radius:999px; text-transform:uppercase; }
.diff.easy{ color:#bdf5c8; background:rgba(80,220,120,.18); border:1px solid rgba(80,220,120,.5); }
.diff.med{ color:#ffe0a3; background:rgba(255,190,80,.16); border:1px solid rgba(255,190,80,.5); }
.diff.hard{ color:#ffb3bd; background:rgba(255,90,110,.16); border:1px solid rgba(255,90,110,.5); }

.hero-detail{ border-radius:18px; padding:18px; background:linear-gradient(160deg, hsla(var(--hue),45%,22%,.5), var(--glass)); border:1px solid hsla(var(--hue),60%,55%,.35); display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; margin-bottom:12px; }
.hd-portrait{ width:84px;height:84px; display:grid;place-items:center; border-radius:50%; background:radial-gradient(circle at 38% 32%, hsla(var(--hue),72%,56%,.7), hsla(var(--hue),60%,22%,.8)); border:3px solid hsla(var(--hue),85%,62%,.7); box-shadow:0 0 26px hsla(var(--hue),80%,50%,.4); }
.hd-portrait svg{ width:60px;height:60px; }
.hd-name{ font-family:var(--font-display); font-size:23px; margin-top:6px; }
.hd-title{ font-size:12px; color:var(--muted); font-weight:800; }
.hd-facs{ display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; justify-content:center; }
.hd-power{ width:100%; margin-top:6px; border-radius:12px; background:rgba(0,0,0,.28); border:1px solid var(--line); padding:10px 12px; text-align:left; }
.hd-power-head{ display:flex; align-items:center; justify-content:space-between; }
.hd-power-name{ font-family:var(--font-display); font-size:15px; color:#ffe08a; }
.hd-power-cost{ position:relative; width:26px;height:26px; display:grid;place-items:center; font-family:var(--font-display); font-size:13px; }
.hd-power-cost svg{ position:absolute; inset:0; width:100%;height:100%; }
.hd-power-cost span{ position:relative; }
.hd-power-text{ font-size:12px; color:var(--dim); margin-top:3px; line-height:1.4; }
.hd-row{ width:100%; display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.hd-k{ font-size:11px; font-weight:900; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
.hd-play{ width:100%; text-align:left; margin-top:8px; }
.hd-play p{ font-size:12.5px; color:var(--dim); line-height:1.45; margin-top:4px; }

.deckcard-list{ display:flex; flex-direction:column; gap:8px; }
.deckcard{ display:flex; align-items:center; gap:0; padding:0; border-radius:12px; text-align:left; cursor:pointer; overflow:hidden;
  background:var(--glass-2); border:1px solid var(--line); transition:transform .15s, border-color .15s, box-shadow .15s; }
.deckcard:hover{ transform:translateX(3px); border-color:var(--line-2); }
.deckcard.sel{ border-color:hsla(var(--hue),85%,64%,.9); box-shadow:0 0 0 1px hsla(var(--hue),85%,62%,.5); }
.deckcard .dc-spine{ width:8px; align-self:stretch; background:linear-gradient(180deg, hsla(var(--hue),80%,60%,1), hsla(var(--hue),70%,40%,1)); }
.deckcard .dc-body{ flex:1; padding:11px 13px; }
.deckcard .dc-name{ font-family:var(--font-display); font-size:15px; }
.deckcard .dc-meta{ font-size:11px; color:var(--muted); font-weight:800; }
.deckcard .dc-count{ font-family:var(--font-display); font-size:18px; color:hsla(var(--hue),85%,75%,1); padding:0 16px; }

.setup-actions{ display:flex; gap:10px; margin-top:14px; padding-top:4px; }
.setup-actions .btn{ flex:1; }
.btn.primary.big{ flex:1.6; font-size:16px; padding:13px; }

@media (max-width:780px){
  .setup-cols{ grid-template-columns:1fr; overflow-y:auto; }
  .setup-left, .setup-right{ overflow:visible; }
}

/* ---------- PLAY A FRIEND: menu buttons ---------- */
.bigbtn.friend{ background:linear-gradient(135deg, rgba(179,136,255,.3), rgba(120,90,220,.16)); border-color:rgba(179,136,255,.55); }
.bigbtn.friend .bb-main{ color:#e3d4ff; }
.bigbtn.friend .bb-icon{ background:rgba(179,136,255,.22); }
.bigbtn.soon{ position:relative; opacity:.72; }
.bigbtn.soon .bb-badge{ position:absolute; top:10px; right:12px; font-size:10px; font-weight:900; letter-spacing:1px; padding:2px 8px; border-radius:999px; background:rgba(255,205,90,.18); color:#ffd05a; border:1px solid rgba(255,205,90,.5); }
.bigbtn.soon .bb-badge{ background:rgba(255,205,90,.18); }

/* ---------- MODAL ---------- */
.modal-overlay{ position:fixed; inset:0; z-index:200; display:grid; place-items:center; background:rgba(6,9,18,.7); opacity:0; transition:opacity .25s; backdrop-filter:blur(3px); }
.modal-overlay.on{ opacity:1; }
.modal-card{ width:min(420px,90vw); background:linear-gradient(160deg, var(--glass), rgba(12,18,38,.96)); border:1px solid var(--line-2); border-radius:18px; padding:26px; text-align:center; transform:translateY(12px) scale(.97); transition:transform .25s cubic-bezier(.2,.8,.3,1.2); }
.modal-overlay.on .modal-card{ transform:none; }
.modal-title{ font-family:var(--font-display); font-size:24px; letter-spacing:1px; }
.modal-badge{ display:inline-block; margin:8px 0 12px; font-size:11px; font-weight:900; letter-spacing:1.5px; padding:3px 12px; border-radius:999px; background:rgba(255,205,90,.16); color:#ffd05a; border:1px solid rgba(255,205,90,.5); }
.modal-card p{ color:var(--muted); font-size:13.5px; line-height:1.55; margin-bottom:18px; }

/* ---------- LOBBY ---------- */
.lobby-inner{ width:min(820px,95vw); margin:0 auto; padding:14px clamp(8px,2vw,20px); display:flex; flex-direction:column; gap:16px; }
.room-code-card{ text-align:center; padding:20px; border-radius:18px; background:linear-gradient(160deg, rgba(63,224,208,.14), var(--glass)); border:1px solid rgba(63,224,208,.4); }
.rc-label{ font-family:var(--font-display); font-size:12px; letter-spacing:2px; color:var(--muted); }
.rc-code{ font-family:var(--font-display); font-size:clamp(40px,8vw,64px); letter-spacing:4px; color:#bff8f1; text-shadow:0 0 24px rgba(63,224,208,.5); margin:4px 0 12px; }
.rc-actions{ display:flex; gap:10px; justify-content:center; }
.rc-hint{ color:var(--dim); font-size:12px; font-weight:700; margin-top:10px; }
.lobby-slots{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; }
.lobby-slot{ border-radius:16px; padding:18px 14px; text-align:center; background:linear-gradient(160deg, hsla(var(--hue,210),45%,24%,.4), var(--glass-2)); border:1px solid var(--line-2); min-height:200px; display:flex; flex-direction:column; align-items:center; gap:5px; transition:border-color .2s, box-shadow .2s; }
.lobby-slot.ready{ border-color:rgba(120,255,210,.7); box-shadow:0 0 0 1px rgba(120,255,210,.5), 0 10px 28px rgba(40,180,160,.3); }
.lobby-slot.empty{ justify-content:center; border-style:dashed; opacity:.7; }
.ls-portrait{ width:72px;height:72px; display:grid;place-items:center; border-radius:50%; background:radial-gradient(circle at 38% 32%, hsla(var(--hue,210),70%,55%,.6), hsla(var(--hue,210),60%,22%,.7)); border:2px solid hsla(var(--hue,210),80%,60%,.6); }
.ls-portrait svg{ width:52px;height:52px; } .ls-q{ font-family:var(--font-display); font-size:30px; color:var(--muted); }
.ls-name{ font-family:var(--font-display); font-size:17px; } .ls-you{ color:var(--muted); font-size:12px; }
.ls-hero{ font-size:13px; font-weight:800; } .ls-power{ font-size:11px; color:var(--dim); } .ls-deck{ font-size:11px; color:var(--muted); font-weight:800; }
.ls-status{ margin-top:6px; font-size:11px; font-weight:900; letter-spacing:1px; padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--muted); }
.ls-status.on{ background:rgba(120,255,210,.18); color:#bff8f1; border:1px solid rgba(120,255,210,.5); }
.ls-wait{ color:var(--muted); font-weight:800; font-size:13px; }
.lobby-vs{ font-family:var(--font-display); font-size:20px; color:var(--muted); }
.lobby-actions{ display:flex; align-items:center; justify-content:center; gap:14px; }
.conn-pill{ font-size:11px; font-weight:900; letter-spacing:.5px; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,.06); color:var(--muted); border:1px solid var(--line); }
.conn-pill.online{ color:#bff8f1; border-color:rgba(63,224,208,.5); } .conn-pill.reconnecting,.conn-pill.connecting{ color:#ffd05a; } .conn-pill.error,.conn-pill.opponent-left,.conn-pill.opponent-gone{ color:#ff8a96; }
.join-card{ max-width:420px; margin:30px auto 0; text-align:center; padding:24px; border-radius:18px; background:var(--glass); border:1px solid var(--line-2); }
.join-label{ font-family:var(--font-display); font-size:12px; letter-spacing:2px; color:var(--muted); margin-bottom:10px; }
.join-codebox{ display:flex; align-items:stretch; max-width:320px; margin:0 auto; border-radius:12px; overflow:hidden; border:1px solid var(--line-2); background:rgba(0,0,0,.32); }
.join-codebox:focus-within{ border-color:rgba(179,136,255,.7); box-shadow:0 0 0 2px rgba(179,136,255,.2); }
.join-prefix{ display:flex; align-items:center; padding:0 10px 0 16px; font-family:var(--font-display); font-size:24px; letter-spacing:3px; color:var(--muted); background:rgba(255,255,255,.04); }
.join-input.has-prefix{ flex:1; border:none; box-shadow:none; background:transparent; text-align:left; padding-left:4px; }
.join-input{ width:100%; height:52px; text-align:center; font-family:var(--font-display); font-size:24px; letter-spacing:3px; border-radius:12px; background:rgba(0,0,0,.32); border:1px solid var(--line-2); color:#eaf2ff; outline:none; text-transform:uppercase; }
.join-input:focus{ border-color:rgba(179,136,255,.7); box-shadow:0 0 0 2px rgba(179,136,255,.2); }
.join-err{ color:#ff8a96; font-size:12.5px; font-weight:800; min-height:18px; margin:10px 0; }
@media (max-width:680px){ .lobby-slots{ grid-template-columns:1fr; } .lobby-vs{ display:none; } }

/* ============================================================
   MATCH
   ============================================================ */
#screen-match{ }
.match{ position:relative; height:100%; display:flex; flex-direction:column; }

/* ---- arena background (tilted board) ---- */
.arena{
  position:absolute; inset:0; overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% -16%, #2a1c66 0%, transparent 52%),
    radial-gradient(120% 100% at 50% 120%, #0b2540 0%, transparent 55%),
    linear-gradient(180deg, var(--rift-top), var(--rift-mid) 46%, var(--rift-low));
}
.arena::before{ /* light beams */
  content:""; position:absolute; inset:-20% -10% -10%;
  background:
    linear-gradient(76deg, transparent 38%, rgba(120,170,255,.10) 49%, transparent 60%),
    linear-gradient(104deg, transparent 40%, rgba(255,180,120,.07) 50%, transparent 62%);
  filter:blur(2px);
  animation: beams 9s ease-in-out infinite alternate;
}
@keyframes beams{ from{ transform:translateX(-3%) } to{ transform:translateX(3%) } }

/* ---- top / bottom HUD ---- */
.hud{
  position:relative; z-index:3;
  display:flex; align-items:center; gap:14px;
  padding:10px 16px;
}
.hud.top{ }
.hud.bottom{ margin-top:auto; }

.heroplate{
  display:flex; align-items:center; gap:12px;
  padding:8px 14px 8px 8px; border-radius:999px;
  background: linear-gradient(180deg, hsla(var(--hue),60%,30%,.55), hsla(var(--hue),50%,16%,.6));
  border:1px solid hsla(var(--hue),70%,60%,.4);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.12);
  position:relative;
}
.heroplate .portrait{
  width:54px;height:54px;border-radius:50%;
  background: radial-gradient(circle at 40% 32%, hsla(var(--hue),90%,72%,1), hsla(var(--hue),70%,38%,1) 72%);
  box-shadow: inset 0 -5px 12px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.4);
  display:grid;place-items:center; flex:none;
}
.heroplate .portrait svg{ width:40px;height:40px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.heroplate .meta{ display:flex;flex-direction:column; line-height:1.05; min-width:84px; }
.heroplate .meta b{ font-family:var(--font-display); font-size:16px; letter-spacing:.3px; }
.heroplate .meta small{ color:var(--muted); font-weight:800; font-size:11px; }

.hpcrystal{
  position:relative; display:grid; place-items:center; width:52px;height:52px; flex:none;
}
.hpcrystal svg{ width:52px;height:52px; filter:drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
.hpcrystal .val{ position:absolute; font-family:var(--font-display); font-size:22px; color:#fff; text-shadow:0 2px 3px rgba(0,0,0,.6); }
.hpcrystal.hit{ animation: hpHit .4s ease; }
@keyframes hpHit{ 0%{transform:scale(1)} 30%{transform:scale(1.35)} 100%{transform:scale(1)} }

.deckpile{ display:flex; align-items:center; gap:6px; color:var(--muted); font-weight:900; font-size:12px; }
.deckpile .stack{
  width:26px;height:34px;border-radius:5px; position:relative;
  background:linear-gradient(160deg,#33508c,#1a2c52); border:1px solid var(--line-2);
  box-shadow:2px 2px 0 rgba(0,0,0,.3), 4px 4px 0 rgba(40,60,110,.6);
}

/* round banner */
.roundtag{
  margin:0 auto; text-align:center; line-height:1;
}
.roundtag .r{ font-family:var(--font-display); font-size:20px; letter-spacing:1px; }
.roundtag .who{ font-weight:900; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); }

/* energy pips */
.energy{ display:flex; align-items:center; gap:7px; }
.energy .pips{ display:flex; gap:3px; }
.pip{ width:13px;height:18px; border-radius:3px 3px 4px 4px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); position:relative; transition:.2s; }
.pip.full{ background:linear-gradient(180deg,#9fe9ff,#2aa7ff); border-color:#bff0ff; box-shadow:0 0 8px #38b6ff, inset 0 -3px 4px rgba(0,0,40,.35); }
.pip.spend{ animation: pipSpend .35s ease; }
@keyframes pipSpend{ 0%{transform:scale(1)}50%{transform:scale(.6);filter:brightness(2)}100%{transform:scale(1)} }
.energy .lbl{ font-family:var(--font-display); font-size:15px; color:#bdeaff; }

/* ---- board / lanes ---- */
.boardwrap{ position:relative; z-index:2; flex:1; display:grid; place-items:center; padding:4px 10px; min-height:0; }
/* While placing, the board must win all clicks over the lifted hand cards. */
.screen.selecting .boardwrap{ z-index:30; }
.screen.selecting .handwrap{ z-index:4; }
.board{
  width:min(1080px, 98vw);
  display:grid; grid-template-columns:repeat(5,1fr); gap:12px;
  transform: perspective(1400px) rotateX(12deg);
  transform-origin:center 60%;
}
.lane{
  position:relative; border-radius:16px;
  background:
    linear-gradient(180deg, hsla(265,60%,40%,.16), transparent 30%, transparent 70%, hsla(200,70%,40%,.16)),
    rgba(255,255,255,.025);
  border:1px solid rgba(150,190,255,.14);
  box-shadow: inset 0 0 24px rgba(0,0,0,.35);
  display:flex; flex-direction:column; gap:8px;
  padding:10px 8px;
  min-height:0;
  transition: box-shadow .18s, border-color .18s, background .2s;
}
.lane .num{
  position:absolute; top:6px; left:8px; font-family:var(--font-display);
  font-size:12px; color:rgba(255,255,255,.25);
}
.lane .seam{
  height:3px; border-radius:3px; margin:1px 4px;
  background:linear-gradient(90deg, transparent, rgba(120,200,255,.5), transparent);
  box-shadow:0 0 10px rgba(90,180,255,.45);
}
.lane.target{ cursor:pointer; border-color:rgba(120,255,210,.7); background:rgba(120,255,210,.08); box-shadow:inset 0 0 26px rgba(60,224,170,.28), 0 0 18px rgba(60,224,170,.3); transition:border-color .25s, background .25s, box-shadow .25s, transform .2s; animation: laneBreathe 1.9s ease-in-out infinite; }
@keyframes laneBreathe{ 50%{ box-shadow:inset 0 0 30px rgba(60,224,170,.42), 0 0 26px rgba(60,224,170,.45) } }
.lane.target:hover{ background:rgba(120,255,210,.16); transform:translateY(-2px); }
.lane.bad{ border-color:rgba(255,110,120,.6); }
.lane .env-tag{
  position:absolute; top:5px; right:7px; font-size:9.5px; font-weight:900;
  padding:2px 6px; border-radius:999px; letter-spacing:.4px;
  background:hsla(var(--ch,200),80%,40%,.5); border:1px solid hsla(var(--ch,200),80%,65%,.6);
  color:#fff; max-width:74%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.lane.env-on{ background-image: radial-gradient(120% 60% at 50% 50%, hsla(var(--ch,200),80%,50%,.16), transparent 70%); }

.slot{ min-height:118px; display:grid; place-items:center; }
.slot.empty::after{
  content:""; width:78%; height:90px; border-radius:12px;
  border:1.6px dashed rgba(160,190,255,.14);
}

/* ---- in-play unit token ---- */
.unit{
  position:relative; width:104px; height:112px; border-radius:13px;
  pointer-events:none;            /* never intercept clicks meant for the lane beneath */
  background:
    radial-gradient(120% 70% at 50% 0%, hsla(var(--hue),85%,62%,.5), transparent 60%),
    linear-gradient(180deg, hsla(var(--hue),55%,32%,.95), hsla(var(--hue),60%,18%,.98));
  border:1.5px solid hsla(var(--hue),80%,62%,.7);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.18);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding-top:6px;
  will-change:transform;
  animation: summon .42s cubic-bezier(.2,1.2,.3,1) both;
}
@keyframes summon{ 0%{transform:translateY(-16px) scale(.45) rotate(-8deg); opacity:0} 55%{opacity:1; transform:translateY(0) scale(1.1,.88)} 74%{transform:scale(.95,1.07)} 100%{transform:none;opacity:1} }
.unit .art{ width:72px;height:62px; display:grid;place-items:center; animation: idleBob 2.7s ease-in-out infinite; }
@keyframes idleBob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3px) } }
.unit .art svg{ width:62px;height:56px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.unit .uname{ font-weight:900; font-size:10.5px; line-height:1; text-align:center; max-width:96px; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.unit .kw{ display:flex; gap:3px; margin-top:2px; min-height:13px; }
.unit .kwpip{ width:13px;height:13px;border-radius:4px; display:grid;place-items:center; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); }
.unit .kwpip svg{ width:9px;height:9px; }
.stat{
  position:absolute; bottom:-7px; width:30px;height:30px; display:grid;place-items:center;
  font-family:var(--font-display); font-size:15px; color:#fff;
}
.stat svg{ position:absolute; inset:0; width:100%;height:100%; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
.stat span{ position:relative; text-shadow:0 1px 2px rgba(0,0,0,.7); }
.stat.atk{ left:-6px; }
.stat.hp{ right:-6px; }
.stat.buffed span{ color:#bfffd0; }
.stat.hurt span{ color:#ffd2d2; }
.unit .badge{ position:absolute; top:-9px; right:-7px; display:flex; gap:2px; }
.unit .frost{ position:absolute; inset:0; border-radius:13px; background:linear-gradient(180deg, rgba(150,225,255,.35), rgba(90,170,255,.18)); border:1.5px solid rgba(180,235,255,.8); pointer-events:none; }
.unit.dying{ animation: die .45s ease forwards; }
@keyframes die{ to{ transform:scale(.2) rotate(20deg); opacity:0; filter:brightness(2); } }
.unit.attack-lunge{ transition: transform .16s cubic-bezier(.3,1.6,.5,1); z-index:5; }
.unit.hitflash::before{ content:""; position:absolute; inset:0; border-radius:13px; background:#fff; opacity:.85; animation: flash .26s ease forwards; pointer-events:none; }
@keyframes flash{ to{ opacity:0 } }
.unit.shielded .shield-ring{ position:absolute; inset:-4px; border-radius:16px; border:2px solid rgba(180,235,255,.85); box-shadow:0 0 14px rgba(120,200,255,.7); pointer-events:none; animation: shimmer 2s linear infinite; }
@keyframes shimmer{ 50%{ opacity:.5 } }

/* ============================================================
   HAND + CARDS
   ============================================================ */
.handwrap{ position:relative; z-index:5; height:188px; }
.hand{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  display:flex; justify-content:center; align-items:flex-end;
  height:100%;
}
.card{
  position:relative; width:128px; height:178px; margin:0 -16px;
  border-radius:var(--r-md);
  touch-action:none; user-select:none; -webkit-user-select:none;
  transform-origin:bottom center;
  transition: transform .2s cubic-bezier(.2,.9,.3,1.3), margin .2s, filter .2s, box-shadow .2s;
  will-change:transform;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,.5));
}
.hand .card{ animation: dealIn .4s cubic-bezier(.2,1,.3,1) both; }
@keyframes dealIn{ 0%{ transform:translateY(60px) scale(.8); opacity:0 } 100%{ opacity:1 } }
.card-inner{
  position:absolute; inset:0; border-radius:var(--r-md); overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% -10%, hsla(var(--hue),85%,58%,.55), transparent 55%),
    linear-gradient(180deg, hsla(var(--hue),48%,26%,.98), hsla(var(--hue),55%,14%,1));
  border:1.5px solid hsla(var(--hue),80%,60%,.55);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 2px rgba(0,0,0,.18);
  display:flex; flex-direction:column; align-items:center;
}
.card .frame-rare{ position:absolute; inset:0; border-radius:var(--r-md); pointer-events:none; }
.rarity-rare .frame-rare{ box-shadow: inset 0 0 0 2px rgba(120,200,255,.7); }
.rarity-epic .frame-rare{ box-shadow: inset 0 0 0 2px rgba(195,140,255,.8), inset 0 0 18px rgba(150,90,255,.4); }
.rarity-legendary .frame-rare{ box-shadow: inset 0 0 0 2px rgba(255,205,90,.95), inset 0 0 22px rgba(255,180,60,.5); }
.rarity-legendary .card-inner{ animation: legShine 3.5s linear infinite; }
@keyframes legShine{ 50%{ filter:brightness(1.12) } }

.card .cost{
  position:absolute; top:-8px; left:-8px; width:38px;height:42px; z-index:3;
  display:grid; place-items:center; font-family:var(--font-display); font-size:20px; color:#06243f;
}
.card .cost svg{ position:absolute; inset:0; width:100%;height:100%; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.card .cost span{ position:relative; text-shadow:0 1px 0 rgba(255,255,255,.4); }
.card .art{
  margin-top:30px; width:104px; height:74px; border-radius:10px;
  background: radial-gradient(120% 100% at 50% 20%, hsla(var(--hue),70%,52%,.7), hsla(var(--hue),60%,22%,.9));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 -8px 14px rgba(0,0,0,.4);
  display:grid; place-items:center; overflow:hidden;
}
.card .art svg{ width:74px;height:66px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.card .namebar{
  width:114px; margin-top:7px; text-align:center; font-family:var(--font-display);
  font-size:12.5px; letter-spacing:.2px; line-height:1; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.card .ctext{
  flex:1; width:114px; margin-top:5px; font-size:9.6px; font-weight:800; line-height:1.16;
  color:#dce9ff; text-align:center; padding:0 2px;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.card .kwrow{ display:flex; gap:3px; justify-content:center; margin-bottom:3px; min-height:14px; }
.card .kwpip{ width:14px;height:14px;border-radius:4px; display:grid;place-items:center; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); }
.card .kwpip svg{ width:10px;height:10px; }
.card .stat{ position:absolute; bottom:6px; }
.card .stat.atk{ left:6px; }
.card .stat.hp{ right:6px; }
.card .typestripe{
  position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
  font-size:8.5px; font-weight:900; letter-spacing:1px; text-transform:uppercase;
  color:hsla(var(--hue),90%,80%,1); opacity:.85;
}

/* hand fan + hover */
.hand .card:hover, .hand .card.peek{
  transform: translateY(-58px) scale(1.18) rotate(0deg) !important;
  margin:0 12px; z-index:40; filter: drop-shadow(0 22px 30px rgba(0,0,0,.6));
}
.hand .card.playable .card-inner{ box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 2px rgba(120,255,210,.55), 0 0 18px rgba(80,240,180,.4); }
.hand .card.playable::after{
  content:""; position:absolute; inset:-3px; border-radius:16px; pointer-events:none;
  box-shadow:0 0 16px rgba(120,255,200,.5); animation: readyPulse 1.6s ease-in-out infinite;
}
@keyframes readyPulse{ 50%{ box-shadow:0 0 26px rgba(120,255,200,.85) } }
.hand .card.unplayable{ filter:grayscale(.5) brightness(.7) drop-shadow(0 8px 12px rgba(0,0,0,.5)); }
.hand .card.selected{ transform: translateY(-58px) scale(1.16) !important; z-index:41; pointer-events:none; }
.hand .card.selected .card-inner{ box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 3px var(--gold), 0 0 26px rgba(255,200,80,.6); }
.hand .card.playing{ animation: cardPlay .42s ease forwards; pointer-events:none; }
@keyframes cardPlay{ to{ transform: translateY(-220px) scale(.6); opacity:0; } }

/* ---- command buttons ---- */
.controls{ display:flex; align-items:center; gap:10px; }
.btn{
  font-family:var(--font-display); letter-spacing:.6px;
  padding:11px 20px; border-radius:13px; font-size:16px;
  background:linear-gradient(180deg, var(--glass-2), rgba(20,28,52,.9));
  border:1px solid var(--line-2);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.14);
  transition: transform .15s, box-shadow .15s, filter .15s;
  position:relative;
}
.btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); filter:brightness(1.06); }
.btn:active:not(:disabled){ transform:translateY(1px) scale(.985); }
.btn:disabled{ opacity:.45; filter:saturate(.4); cursor:not-allowed; }
.btn.primary{ background:linear-gradient(135deg, rgba(63,224,208,.4), rgba(40,167,255,.28)); border-color:rgba(63,224,208,.7); color:#eafffb; }
.btn.primary:hover:not(:disabled){ box-shadow:0 12px 30px rgba(40,180,200,.4), inset 0 1px 0 rgba(255,255,255,.2); }
.btn.power{ background:linear-gradient(180deg, hsla(var(--hue),70%,46%,.95), hsla(var(--hue),70%,26%,1)); border-color:hsla(var(--hue),85%,65%,.7); }
.btn.power .pc{ position:absolute; top:-9px; right:-7px; font-size:11px; background:#0c2d52; border:1px solid #57c8ff; border-radius:999px; padding:1px 6px; font-family:var(--font-body); font-weight:900; }
.btn.end{ background:linear-gradient(180deg, #18b88a, #0c7d5d); border-color:#3fe0d0; color:#eafff8; }
.btn.end.glow{ animation: endGlow 1.4s ease-in-out infinite; }
@keyframes endGlow{ 50%{ box-shadow:0 0 0 3px rgba(63,224,208,.4), 0 14px 30px rgba(20,180,140,.6), inset 0 1px 0 rgba(255,255,255,.2) } }
.btn.ghost{ background:rgba(255,255,255,.05); border-color:var(--line); font-size:13px; padding:9px 14px; }

.mode.build{ background:linear-gradient(160deg, rgba(179,136,255,.22), var(--glass-2)); border-color:rgba(179,136,255,.4); }
.mode.build strong{ color:#d8c8ff; }

/* ---------- DECK BUILDER (redesigned) ---------- */
.db2{ flex:1; display:flex; flex-direction:column; min-height:0; width:100%; height:100%; }
.db2-top{ display:flex; align-items:center; gap:8px; padding:12px clamp(8px,2vw,18px); flex-wrap:wrap;
  background:linear-gradient(180deg, rgba(14,20,40,.9), rgba(10,15,32,.6)); border-bottom:1px solid var(--line); }
.db-search{ flex:1; min-width:160px; height:38px; padding:0 14px; border-radius:11px; font-size:14px; font-weight:700;
  background:rgba(0,0,0,.32); border:1px solid var(--line-2); color:#eaf2ff; outline:none; transition:border-color .15s, box-shadow .15s; }
.db-search:focus{ border-color:rgba(63,224,208,.7); box-shadow:0 0 0 2px rgba(63,224,208,.2); }
.db-search::placeholder{ color:var(--dim); }
.db-sel{ height:38px; padding:0 10px; border-radius:11px; font-size:12.5px; font-weight:800; color:#dfe8fa;
  background:rgba(0,0,0,.32); border:1px solid var(--line); cursor:pointer; outline:none; transition:border-color .15s; }
.db-sel:hover{ border-color:var(--line-2); }
.db-sel:focus{ border-color:rgba(120,160,255,.6); }

.db2-body{ flex:1; display:grid; grid-template-columns: 1fr 330px; gap:0; min-height:0; }
.db2-grid{ overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(124px,1fr)); gap:10px;
  align-content:start; padding:16px clamp(8px,2vw,18px); }
.grid-empty{ grid-column:1/-1; text-align:center; color:var(--dim); padding:50px 0; font-weight:800; }

.gcard{ position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 6px 7px; border-radius:13px;
  background:linear-gradient(180deg, hsla(var(--hue),48%,24%,.55), hsla(var(--hue),42%,13%,.7));
  border:1px solid hsla(var(--hue),60%,52%,.45); cursor:pointer; min-height:128px; text-align:center;
  transition: transform .16s cubic-bezier(.2,.9,.3,1.4), box-shadow .16s, border-color .16s, z-index 0s; }
