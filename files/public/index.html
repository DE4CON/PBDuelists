/* ====================== DECK BUILDING ====================== */
function deckForHero(heroId, rng){
  const hero=getHero(heroId);
  const facs=new Set([...hero.facs,'prism']);
  const pool=Object.values(CARDS).filter(c=>facs.has(c.fac));
  const copies={Common:4,Rare:4,Epic:3,Legendary:2};
  let list=[];
  for(const c of pool){ for(let i=0;i<copies[c.rar];i++) list.push(c.id); }
  list=shuffle(list,rng);
  list=list.slice(0,40);
  return shuffle(list,rng);
}

/* ====================== ENGINE ====================== */
let state=null;

// Centralized game RNG. ALL randomness that affects game state (shuffles, draws,
// block-meter rolls, superpower grants, AI tiebreaks, opponent selection) must go
// through this — never Math.random. This is what lets a server reproduce a match
// deterministically from a seed and stay authoritative. (Cosmetic FX/audio jitter
// may still use Math.random; it never touches game state.)
function rngRoll(){ return state && state.rng ? state.rng() : Math.random(); }
function rngInt(n){ return Math.floor(rngRoll()*n); }
function rngPick(arr){ return arr[rngInt(arr.length)]; }

function makeUnit(cardId, side, lane){
  const c=getCard(cardId);
  const u={
    uid:uid(), cardId, side, lane, name:c.name, shape:c.shape, hue:H[c.fac],
    attack:c.atk||0, health:c.hp||1, maxHealth:c.hp||1,
    armor:c.armor||0, keywords:(c.kw||[]).slice(),
    frozen:false, stunned:0, burn:0, shield:false, alive:true, justSummoned:true,
    raged:false
  };
  if(c.lastBreath){ if(!u.keywords.includes('Last Breath')) u.keywords.push('Last Breath'); u._lastBreath=c.lastBreath; }
  return u;
}
function hasKw(u,k){ return u && u.keywords && u.keywords.includes(k); }

function createMatch({seed, players, humanSide=0, vanguardSide}){
  const rng=makeRng(seed);
  const board=[]; for(let i=0;i<5;i++) board.push({env:null, units:[null,null]});
  const ps=players.map((p,side)=>{
    const hero=getHero(p.heroId);
    return { side, name:p.name, heroId:p.heroId, hue:hero.hue, bot:!!p.bot,
      hp:20, energy:0, hand:[], deck:(p.deck&&p.deck.length)?shuffle(p.deck.slice(),rng):deckForHero(p.heroId,rng), discard:[], heroPowerUsed:false,
      block:0, blockCap:8, supersUsed:0 };
  });
  return { seed, rng, round:0, maxEnergy:0, firstPlayer:0, vanguard:(typeof vanguardSide==='number'?vanguardSide:humanSide), phase:'play', active:0, winner:null, humanSide, board, players:ps, log:[] };
}
function logLine(t){ state.log.push(t); if(state.log.length>40) state.log.shift(); }

function drawCard(side,n=1,fx){
  const p=state.players[side];
  for(let i=0;i<n;i++){
    if(!p.deck.length) continue;            // no fatigue, just stop
    if(p.hand.length>=8){ p.deck.pop(); continue; } // burn over-draw
    const id=p.deck.pop();
    p.hand.push({iid:uid(), cardId:id});
    fx&&fx.push({type:'draw',side});
  }
}

function allUnits(){ const a=[]; for(const l of state.board) for(const u of l.units) if(u && u.alive) a.push(u); return a; }
function enemyUnit(side,lane){ const u=state.board[lane].units[1-side]; return (u && u.alive)?u:null; }
function allyUnit(side,lane){ const u=state.board[lane].units[side]; return (u && u.alive)?u:null; }

// Single source of truth for clearing the dead. Nulls out any slot whose unit is
// not alive, firing Last Breath effects exactly once. Returns the uids reaped so
// the view can animate their removal. ALL gameplay systems read occupancy through
// the alive-aware helpers above, so once reaped a unit is gone everywhere at once.
function reapDead(fx){
  const reaped=[];
  for(let lane=0; lane<5; lane++){
    for(let side=0; side<2; side++){
      const u=state.board[lane].units[side];
      if(u && !u.alive && !u._reaped){
        u._reaped=true;
        reaped.push(u.uid);
        state.board[lane].units[side]=null;            // remove from board state immediately
        state.players[side].discard.push(u.cardId);
        if(hasKw(u,'Last Breath') && u._lastBreath && !u._lbFired){
          u._lbFired=true;
          applyEffect(side, u._lastBreath, lane, fx, u.uid);
        }
        fx&&fx.push({type:'death', uid:u.uid, side, lane});
      }
    }
  }
  // Last Breath can kill more units (e.g. a damage burst) — reap again.
  if(reaped.length){ for(let lane=0;lane<5;lane++) for(let side=0;side<2;side++){ const u=state.board[lane].units[side]; if(u && !u.alive){ reapDead(fx); return reaped; } } }
  return reaped;
}

function placeUnit(side,lane,cardId){
  const u=makeUnit(cardId,side,lane);
  state.board[lane].units[side]=u;
  return u;
}

function targetLanes(side, spec){
  const lanes=[];
  for(let i=0;i<5;i++){
    const enemy=enemyUnit(side,i), ally=allyUnit(side,i);
    if(spec.kind==='place'){ if(!ally) lanes.push(i); continue; }
    if(spec.ally){
      if(spec.kind==='summonSpread'||spec.kind==='summonToken'){ if(!ally) lanes.push(i); }
      else { if(ally) lanes.push(i); }            // buff/aegis/updraft need a friendly unit
    } else {
      if(spec.unitOnly){ if(enemy) lanes.push(i); }   // damage/destroy/silence/freeze on a unit
      else lanes.push(i);                             // can hit hero too
    }
  }
  return lanes;
}

function dealUnitDamage(u, amt, opts={}, fx){
  if(!u || !u.alive) return 0;
  if(amt<=0 && !opts.deadly) return 0;
  if(u.shield && !opts.deadly){ u.shield=false; fx&&fx.push({type:'shieldBreak',uid:u.uid}); return 0; }
  let dmg=amt;
  if(!opts.ignoreArmor) dmg=Math.max(0, dmg-(u.armor||0));
  if(opts.deadly || opts.attackerDeadly){ u.health=0; }
  else u.health-=dmg;
  if(u.health<=0){ u.health=0; u.alive=false; }
  else if(opts.fromAttack && hasKw(u,'Rage') && !u.raged){
    // Rage: the first time it survives combat damage, it grows.
    u.raged=true; u.attack+=2; u.health+=1; u.maxHealth+=1; fx&&fx.push({type:'buff',uid:u.uid});
  }
  fx&&fx.push({type:'unitDmg',uid:u.uid,amt:Math.max(dmg,(opts.deadly||opts.attackerDeadly)?u.maxHealth:0)});
  return dmg;
}
function dealHeroDamage(side, amt, fx){
  if(amt<=0) return;
  const p=state.players[side];
  p.hp=Math.max(0,p.hp-amt);
  fx&&fx.push({type:'heroDmg',side,amt});
  // Block meter: 8 segments. Each hit charges it a random 1–3 segments.
  const gain=1+rngInt(3);
  p.block=(p.block||0)+gain;
  if(p.hp>0 && p.block>=p.blockCap){
    p.block-=p.blockCap;                         // carry the overflow
    const sid=grantSuper(side,fx);
    fx&&fx.push({type:'superpower',side,cardId:sid});
  }
  checkWin();
}
function grantSuper(side, fx){
  const p=state.players[side], hero=getHero(p.heroId);
  const pool=hero.supers||[];
  if(!pool.length) return null;
  const id=rngPick(pool);
  p.hand.push({iid:uid(), cardId:id, super:true});
  if(p.hand.length>9) p.hand.shift();
  p.supersUsed++;
  logLine(`${p.name} channels ${getCard(id).name}!`);
  return id;
}
function healHero(side, amt, fx){
  const p=state.players[side]; const before=p.hp; p.hp=Math.min(20,p.hp+amt);
  fx&&fx.push({type:'heroHeal',side,amt:p.hp-before});
}

function applyEffect(side, eff, lane, fx, sourceUid){
  const opp=1-side;
  switch(eff.kind){
    case 'healHero': healHero(side, eff.amt, fx); break;
    case 'draw': drawCard(side, eff.amt, fx); break;
    case 'gainEnergy': state.players[side].energy+=eff.amt; fx&&fx.push({type:'energy',side}); break;
    case 'gainMaxEnergy': state.maxEnergy+=eff.amt; state.players[side].energy+=eff.amt; fx&&fx.push({type:'energy',side}); break;
    case 'laneDamage':{
      const u=enemyUnit(side,lane);
      if(u){ dealUnitDamage(u, eff.amt, {}, fx); if(eff.burn) u.burn=Math.max(u.burn,eff.burn); if(eff.freeze) u.frozen=true; }
      else if(!eff.unitOnly){ dealHeroDamage(opp, eff.amt, fx); }
      break; }
    case 'wildfire':{ for(const u of allUnits()) if(u.side===opp) dealUnitDamage(u,eff.amt,{},fx); dealHeroDamage(opp,eff.amt,fx); if(eff.draw) drawCard(side,eff.draw,fx); break; }
    case 'tempest':{ for(const u of allUnits()) if(u.side===opp) dealUnitDamage(u,eff.amt,{},fx); drawCard(side,eff.draw||1,fx); break; }
    case 'massBuff':{
      for(const u of allUnits()) if(u.side===side){
        u.attack+=eff.atk||0;
        if(eff.hp){ u.health+=eff.hp; u.maxHealth+=eff.hp; }
        if(eff.shield) u.shield=true;
        fx&&fx.push({type:'buff',uid:u.uid});
      }
      if(eff.heal) healHero(side,eff.heal,fx);
      break; }
    case 'freezeAll':{ for(const u of allUnits()) if(u.side===opp){ u.frozen=true; fx&&fx.push({type:'freeze',uid:u.uid}); } break; }
    case 'summonAll':{ for(let i=0;i<5;i++) if(!allyUnit(side,i)){ const t=placeUnit(side,i,eff.token); fx&&fx.push({type:'summon',uid:t.uid}); } break; }
    case 'overrun':{
      for(let i=0;i<5;i++) if(!allyUnit(side,i)){ const t=placeUnit(side,i,eff.token); fx&&fx.push({type:'summon',uid:t.uid}); }
      for(const u of allUnits()) if(u.side===side){ u.attack+=eff.atk||0; if(eff.hp){ u.health+=eff.hp; u.maxHealth+=eff.hp; } fx&&fx.push({type:'buff',uid:u.uid}); }
      break; }
    case 'destroyAll':{ for(const u of allUnits()) if(u.side===opp) dealUnitDamage(u,9999,{deadly:true,ignoreArmor:true},fx); break; }
    case 'destroyStrongest':{ let best=null; for(const u of allUnits()) if(u.side===opp){ if(!best||(u.attack+u.health)>(best.attack+best.health)) best=u; } if(best) dealUnitDamage(best,9999,{deadly:true,ignoreArmor:true},fx); break; }
    case 'destroy':{ const u=enemyUnit(side,lane); if(u){ dealUnitDamage(u,9999,{deadly:true,ignoreArmor:true},fx); } break; }
    case 'silence':{ const u=enemyUnit(side,lane); if(u){ u.keywords=[]; u.armor=0; u.frozen=false; u.burn=0; fx&&fx.push({type:'silence',uid:u.uid}); } break; }
    case 'freezeLane':{ const u=enemyUnit(side,lane); if(u){ u.frozen=true; fx&&fx.push({type:'freeze',uid:u.uid}); } break; }
    case 'stun':{ const u=enemyUnit(side,lane); if(u){ u.stunned=Math.max(u.stunned||0,1); fx&&fx.push({type:'freeze',uid:u.uid}); } break; }
    case 'aegis':{ const u=allyUnit(side,lane); if(u){ u.health+=3; u.maxHealth+=3; u.shield=true; fx&&fx.push({type:'buff',uid:u.uid}); } break; }
    case 'updraft':{ const u=allyUnit(side,lane); if(u){ u.attack+=2; u.health+=1; u.maxHealth+=1; fx&&fx.push({type:'buff',uid:u.uid}); } break; }
    case 'buffUnit':{ const u=allyUnit(side,lane); if(u){ u.attack+=eff.atk||0; u.health+=eff.hp||0; u.maxHealth+=eff.hp||0; fx&&fx.push({type:'buff',uid:u.uid}); } break; }
    case 'rally':{ for(const u of allUnits()) if(u.side===side && u.uid!==sourceUid){ u.attack+=eff.atk||0; u.health+=eff.hp||0; u.maxHealth+=eff.hp||0; fx&&fx.push({type:'buff',uid:u.uid}); } break; }
    case 'summonToken':{ if(!allyUnit(side,lane)){ const t=placeUnit(side,lane,eff.token); fx&&fx.push({type:'summon',uid:t.uid}); } break; }
    case 'summonSpread':{
      if(!allyUnit(side,lane)){ const t=placeUnit(side,lane,eff.token); fx&&fx.push({type:'summon',uid:t.uid}); }
      const adj=[lane+1,lane-1].find(j=>j>=0&&j<5&&!allyUnit(side,j));
      if(adj!=null){ const t2=placeUnit(side,adj,eff.token); fx&&fx.push({type:'summon',uid:t2.uid}); }
      break; }
  }
  reapDead(fx);
  checkWin();
}

/* ---- COMBAT LOGIC (pure, deterministic — no DOM; safe to run server-side) ---- */
// Will `u` survive the incoming strike `incoming` (its blocker's blow)?
function unitSurvives(u, incoming){
  if(!u || !u.alive) return false;
  if(!incoming || incoming.target!=='unit' || incoming.defender!==u) return true;
  if(incoming.deadly) return false;
  if(u.shield) return true;
  const dmg=Math.max(0, incoming.amt-(u.armor||0));
  return u.health > dmg;
}
function computeStrike(attacker, defender){
  if(!attacker || !attacker.alive || attacker.frozen || attacker.stunned>0 || attacker.attack<=0) return null;
  const liveDef = (defender && defender.alive) ? defender : null;
  const target = liveDef ? 'unit' : 'hero';
  return { attacker, defender:liveDef, target,
    amt:attacker.attack,
    deadly:hasKw(attacker,'Deadly'),
    strikethrough:hasKw(attacker,'Strikethrough'),
    lifesteal:hasKw(attacker,'Lifesteal'),
    frenzy:hasKw(attacker,'Frenzy'),
    double:hasKw(attacker,'Double Strike') };
}
function applyStrike(strike, side, fxArr){
  const opp=1-side;
  const atkr=strike.attacker;
  const swings=strike.double?2:1;
  for(let s=0;s<swings;s++){
    if(s>0 && !atkr.alive) break;
    let tgtUnit = (strike.target==='unit' && strike.defender && strike.defender.alive) ? strike.defender : null;
    if(tgtUnit){
      const hp0=tgtUnit.health, shield0=tgtUnit.shield;
      dealUnitDamage(tgtUnit, strike.amt, {deadly:strike.deadly, fromAttack:true}, fxArr);
      const killed = !tgtUnit.alive;
      const applied = shield0 ? 0 : Math.min(strike.amt, hp0);
      if(strike.lifesteal && applied>0) healHero(side, applied, fxArr);
      if(strike.strikethrough && !shield0){ const over=strike.amt-hp0; if(over>0) dealHeroDamage(opp, over, fxArr); }
      if(killed){
        fxArr.push({type:'kill', side});
        if(strike.frenzy && strike.attackerSurvives) dealHeroDamage(opp, strike.amt, fxArr);
      }
    } else if(strike.target==='hero' || !strike.defender){
      dealHeroDamage(opp, strike.amt, fxArr);
      if(strike.lifesteal) healHero(side, strike.amt, fxArr);
    }
  }
}
// Resolve one lane fully and return the fx events (pure; the view animates from these).
function resolveLaneStrikes(laneIndex){
  const V=state.vanguard, R=1-V;
  const aV=state.board[laneIndex].units[V], aR=state.board[laneIndex].units[R];
  const sV=computeStrike(aV,aR), sR=computeStrike(aR,aV);
  if(sV) sV.attackerSurvives=unitSurvives(aV,sR);
  if(sR) sR.attackerSurvives=unitSurvives(aR,sV);
  return {sV, sR, V, R};
}

// returns {ok, fx, summonedUid} — mutates state
function playCard(side, iid, lane){
  const p=state.players[side];
  const idx=p.hand.findIndex(h=>h.iid===iid);
  if(idx<0) return {ok:false,error:'Card not in hand.'};
  const inst=p.hand[idx]; const card=getCard(inst.cardId);
  if(card.cost>p.energy) return {ok:false,error:'Not enough energy.'};
  const fx=[];

  if(card.type==='unit'){
    if(lane==null || allyUnit(side,lane)) return {ok:false,error:'Choose an empty lane.'};
    p.energy-=card.cost; p.hand.splice(idx,1);
    const u=placeUnit(side,lane,card.id);
    fx.push({type:'energy',side});
    if(card.eff) applyEffect(side, card.eff, lane, fx, u.uid);
    logLine(`${p.name} played ${card.name}.`);
    checkWin();
    return {ok:true,fx,summonedUid:u.uid};
  } else { // spell
    const spec=card.eff;
    if(spec.placement==='lane'){
      if(lane==null) return {ok:false,error:'Choose a lane.'};
      const valid=targetLanes(side, spec);
      if(!valid.includes(lane)) return {ok:false,error:'Invalid target.'};
    }
    p.energy-=card.cost; p.hand.splice(idx,1); p.discard.push(inst.cardId);
    fx.push({type:'cast',side,lane,card:card.id});
    if(spec) applyEffect(side, spec, lane, fx);
    logLine(`${p.name} cast ${card.name}.`);
    checkWin();
    return {ok:true,fx};
  }
}

function useHeroPower(side, lane){
  const p=state.players[side]; const hero=getHero(p.heroId); const pw=hero.power;
  if(p.heroPowerUsed) return {ok:false,error:'Hero power already used.'};
  if(pw.cost>p.energy) return {ok:false,error:'Not enough energy.'};
  if(pw.placement==='lane'){
    const valid=targetLanes(side, pw);
    if(lane==null || !valid.includes(lane)) return {ok:false,error:'Invalid target.'};
  }
  const fx=[]; p.energy-=pw.cost; p.heroPowerUsed=true;
  fx.push({type:'energy',side},{type:'power',side});
  applyEffect(side, pw, lane, fx);
  logLine(`${p.name} used ${pw.name}.`);
  checkWin();
  return {ok:true,fx};
}

function checkWin(){
  if(state.winner!=null) return state.winner;
  const d0=state.players[0].hp<=0, d1=state.players[1].hp<=0;
  if(d0&&d1) state.winner='draw';
  else if(d1) state.winner=0;
  else if(d0) state.winner=1;
  return state.winner;
}

function roundUpkeep(fx){
  state.round++;
  if(state.round===1){ state.maxEnergy=1; drawCard(0,4,fx); drawCard(1,4,fx); }
  else { state.maxEnergy=Math.min(10,state.maxEnergy+1); drawCard(0,1,fx); drawCard(1,1,fx); }
  for(const p of state.players){ p.energy=state.maxEnergy; p.heroPowerUsed=false; }
  // burn ticks
  for(const u of allUnits()){
    if(u.burn>0){ dealUnitDamage(u,1,{ignoreArmor:true},fx); u.burn--; }
    u.justSummoned=false;
  }
  reapDead(fx);
  checkWin();
}

/* ====================== SESSION LAYER ======================
   Three architectural layers, strictly separated:

     PRESENTATION (script_c.js + index.html): UI, animation, sound, fx, menus,
       card rendering. NEVER mutates game state — it only dispatches actions and
       animates the returned fx event list.
     GAME ENGINE (above in this file): combat, damage, turn flow, card effects,
       keywords, hero powers, draws, summons, death processing, victory. Pure and
       DOM-free; mutates only `state`; all randomness via the seeded rng helpers.
     SESSION (here): receives player actions, validates them, advances state,
       manages turn/phase flow, and records an action log so a match can be
       reconstructed deterministically from {seed, actions[]}.

   A Session is a uniform interface. The game does not care which implementation
   is running:
     LocalAISession      — single-player vs the built-in AI (today)
     LocalHotseatSession  — two humans, same device, pass-and-play (today)
     FutureOnlineSession  — authoritative server over WebSocket (later; the same
                            methods, but dispatch() sends the action to the server
                            and awaits the authoritative result + snapshot)

   Action shapes (this IS the future wire protocol):
     {type:'playCard',   side, iid, lane}
     {type:'heroPower',  side, lane}
     {type:'selectTarget', side, lane}     // explicit targeting step (network-friendly)
     {type:'endPhase',   side}             // player ends their current phase
     {type:'concede',    side}             // forfeit
     {type:'upkeep'}                        // start-of-round draws / energy / burn
     {type:'resolveLane', laneIndex}        // snapshot a lane's strikes
     {type:'applyStrike', strike, side}     // apply one resolved strike
     {type:'reap'}                          // remove dead units
     {type:'endCombat'}                     // thaw freeze, tick stun
   Every dispatch returns {ok, fx, error}. fx is a pure data event list (no DOM);
   it is exactly what a server would serialize back to each client to animate. */

// The core action processor shared by every local session. Validates + applies an
// action against the engine state and appends it to the action log. A server would
// run this exact switch as the authoritative source of truth.
function coreDispatch(log, action){
  let res;
  switch(action.type){
    case 'playCard':    res = playCard(action.side, action.iid, action.lane); break;
    case 'heroPower':   res = useHeroPower(action.side, action.lane); break;
    case 'selectTarget':res = {ok:true, fx:[], lane:action.lane}; break; // targeting is resolved client-side then sent with the move; this is the network seam
    case 'endPhase':    res = {ok:true, fx:[]}; break;                    // phase flow is driven by the controller loop; logged for replay/order
    case 'concede':     { const w=1-action.side; state.winner=w; res={ok:true, fx:[{type:'concede',side:action.side}]}; break; }
    case 'upkeep':      { const fx=[]; roundUpkeep(fx); res={ok:true, fx}; break; }
    case 'resolveLane': res = {ok:true, fx:[], strikes:resolveLaneStrikes(action.laneIndex)}; break;
    case 'applyStrike': { const fx=[]; applyStrike(action.strike, action.side, fx); res={ok:true, fx}; break; }
    case 'reap':        { const fx=[]; reapDead(fx); res={ok:true, fx}; break; }
    case 'endCombat':   { for(const u of allUnits()){ if(u.frozen) u.frozen=false; if(u.stunned>0) u.stunned--; } reapDead([]); res={ok:true, fx:[]}; break; }
    default:            res = {ok:false, error:'Unknown action '+action.type};
  }
  // Record successful, state-affecting actions for replay/reconnect reconstruction.
  // (Transient resolution steps like applyStrike/reap are deterministic consequences
  // of resolveLane, so we log intent-level actions, not every micro-step.)
  if(res.ok && log && ['playCard','heroPower','selectTarget','endPhase','concede','upkeep'].includes(action.type)){
    log.push({t:action.type, side:action.side, iid:action.iid, lane:action.lane});
  }
  return res;
}

// Shared base every local session is built on. `mode` distinguishes AI vs hotseat.
function makeLocalSession(opts, mode){
  state = createMatch(opts);     // engine state lives here (server owns it later)
  const actionLog = [];
  return {
    kind:mode,                    // 'ai' | 'hotseat'
    seed: state.seed,
    get state(){ return state; },
    snapshot(){ return state; },               // remote clients get this instead of the live object
    actions(){ return actionLog.slice(); },    // {seed, actions[]} fully reconstructs the match
    isBotTurn(side){ return mode==='ai' && !!state.players[side].bot; },
    isHuman(side){ return !state.players[side].bot; },
    dispatch(action){ return coreDispatch(actionLog, action); },
    // The AI is just another action source, driven through the SAME dispatch path a
    // network opponent would use (see aiTurn — it now routes through session.dispatch).
    aiActions(side, allow){ return aiTurn(side, allow); }
  };
}

// Named session types — the game treats them identically.
function LocalAISession(opts){ return makeLocalSession(opts, 'ai'); }
function LocalHotseatSession(opts){
  // Two humans on one device: neither side is a bot.
  const o = Object.assign({}, opts);
  o.players = opts.players.map(p=>Object.assign({}, p, {bot:false}));
  return makeLocalSession(o, 'hotseat');
}
// FutureOnlineSession(opts) — NOT IMPLEMENTED (needs a backend; see MULTIPLAYER_ROADMAP.md).
// It will expose the identical interface: dispatch(action) sends the action to the
// authoritative server and resolves with {ok, fx} derived from the server's state;
// snapshot() returns the latest server-pushed (fog-of-war) snapshot. No other layer changes.

// Backwards-compatible alias (older call sites used createLocalSession).
function createLocalSession(opts){ return LocalAISession(opts); }
let session=null;   // the active Session (local today, online later)

/* ====================== AI ====================== */
function aiPlan(side){
  const p=state.players[side], opp=1-side;
  const plays=[]; // ordered list of intended actions {iid, lane} or {power, lane}
  // simulate energy budget greedily on a shallow heuristic (no full lookahead)
  let energy=p.energy;
  const hand=()=>p.hand.map(h=>({h,c:getCard(h.cardId)}));
  const score=(c)=>{ // rough card value
    let v=c.cost*2+1;
    if(c.type==='unit') v+=(c.atk||0)+(c.hp||0)*0.6+(c.kw?c.kw.length:0)*1.5;
    if(c.eff){ const k=c.eff.kind; if(['destroy','laneDamage','wildfire','tempest'].includes(k)) v+=4; if(k==='draw')v+=3; }
    return v;
  };
  return {energy,score,hand};
}
async function aiTurn(side, allow){
  allow = allow || {units:true, spells:true, power:true};
  view.thinking(true);
  await delay(620);
  const p=state.players[side], opp=1-side, hero=getHero(p.heroId);
  let guard=0;
  while(guard++<14){
    const plays=p.hand.map(h=>({h,c:getCard(h.cardId)})).filter(x=>x.c.cost<=p.energy);
    let acted=false;

    // 0) Superpower — free and strong, always fire it
    const sup=plays.find(x=>x.c.super);
    if(sup){
      const lane=(sup.c.eff&&sup.c.eff.placement==='lane')?targetLanes(side,sup.c.eff)[0]:null;
      if(sup.c.eff?.placement!=='lane' || lane!=null){
        const r=session.dispatch({type:'playCard',side,iid:sup.h.iid,lane});
        if(r.ok){ await controller.aiPlayFx(sup.c,lane,r); acted=true; }
      }
    }

    // 1) removal: hit player's biggest threat
    const threats=[];
    for(let i=0;i<5;i++){ const u=enemyUnit(side,i); if(u) threats.push({u,i,val:u.attack*2+u.health}); }
    threats.sort((a,b)=>b.val-a.val);
    if(!acted && allow.spells){
    const removal=plays.find(x=>!x.c.super && x.c.eff && ['destroy','laneDamage','stun','freezeLane','silence'].includes(x.c.eff.kind) && (x.c.eff.unitOnly||x.c.type==='spell'));
    if(removal && threats.length && threats[0].val>=6){
      const tgt=threats[0];
      const r=session.dispatch({type:'playCard',side,iid:removal.h.iid,lane:tgt.i});
      if(r.ok){ await controller.aiPlayFx(removal.c,tgt.i,r); acted=true; }
    }
    }

    // 2) play strongest affordable unit into a smart lane
    if(!acted && allow.units){
      const units=plays.filter(x=>x.c.type==='unit' && !x.c.super).sort((a,b)=>(b.c.cost)-(a.c.cost));
      if(units.length){
        const pick=units[0];
        const lane=chooseLane(side,pick.c);
        if(lane!=null){ const r=session.dispatch({type:'playCard',side,iid:pick.h.iid,lane}); if(r.ok){ await controller.aiPlayFx(pick.c,lane,r); acted=true; } }
      }
    }

    // 3) value spells (draw / buff / board)
    if(!acted && allow.spells){
      const sp=plays.find(x=>!x.c.super && x.c.type==='spell' && ['draw','wildfire','tempest','rally','gainMaxEnergy','massBuff','freezeAll','summonAll','destroyStrongest','destroyAll','overrun','healHero'].includes(x.c.eff?.kind));
      if(sp){ const lane=sp.c.eff.placement==='lane'?targetLanes(side,sp.c.eff)[0]:null;
        if(sp.c.eff.placement!=='lane' || lane!=null){ const r=session.dispatch({type:'playCard',side,iid:sp.h.iid,lane}); if(r.ok){ await controller.aiPlayFx(sp.c,lane,r); acted=true; } } }
    }

    // 4) hero power if affordable & useful
    if(!acted && allow.power && !p.heroPowerUsed && hero.power.cost<=p.energy){
      const lanes=hero.power.placement==='lane'?targetLanes(side,hero.power):[null];
      let lane=lanes[0];
      if(hero.power.kind==='laneDamage'){ const t=threats.find(t=>t.u.health<=hero.power.amt); lane=t?t.i:(threats[0]?threats[0].i:lanes[0]); }
      if(lane!==undefined && (hero.power.placement!=='lane'||lane!=null)){
        const r=session.dispatch({type:'heroPower',side,lane}); if(r.ok){ await controller.aiPowerFx(hero,lane,r); acted=true; }
      }
    }

    if(checkWin()!=null) break;
    if(!acted) break;
    await delay(480);
  }
  view.thinking(false);
  await delay(220);
}
function chooseLane(side,card){
  const opp=1-side;
  // prefer lane that blocks an enemy attacker which would otherwise hit our hero
  let best=null, bestScore=-1;
  for(let i=0;i<5;i++){
    if(allyUnit(side,i)) continue;
    const enemy=enemyUnit(side,i);
    let s=1;
    if(enemy){ // blocking value
      s+= enemy.attack*1.5; // we can trade/block
      if(card.atk>=enemy.health) s+=3; // favorable trade
    } else {
      s+= 2; // open lane to pressure hero
    }
    s+= rngRoll()*0.6;
    if(s>bestScore){ bestScore=s; best=i; }
  }
  return best;
}

/* ====================== AUDIO ====================== */
const audio=(function(){
  let ctx=null, master=null, muted=false, padTimer=null, started=false;
  function C(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);} return ctx; }
  function tone({f=440,d=.08,type='sine',g=.05,slide=0,delay=0}={}){
    const c=C(); const t=c.currentTime+delay;
    const o=c.createOscillator(), a=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    a.gain.setValueAtTime(.0001,t); a.gain.exponentialRampToValueAtTime(muted?.0001:g,t+.012);
    a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a).connect(master); o.start(t); o.stop(t+d+.03);
  }
  function noise({d=.12,g=.05,delay=0,hp=800}={}){
    const c=C(); const t=c.currentTime+delay;
    const n=c.createBufferSource(); const buf=c.createBuffer(1,c.sampleRate*d,c.sampleRate);
    const dat=buf.getChannelData(0); for(let i=0;i<dat.length;i++) dat[i]=(Math.random()*2-1)*(1-i/dat.length);
    n.buffer=buf; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const a=c.createGain(); a.gain.value=muted?0:g; n.connect(f).connect(a).connect(master); n.start(t); n.stop(t+d);
  }
  const sfx={
    ui(){ tone({f:560,d:.05,type:'triangle',g:.03,slide:120}); },
    select(){ tone({f:700,d:.06,type:'triangle',g:.035,slide:160}); },
    card(){ tone({f:320,d:.07,type:'sawtooth',g:.03,slide:120}); tone({f:720,d:.06,type:'triangle',g:.025,delay:.05}); },
    summon(){ tone({f:200,d:.12,type:'sine',g:.045,slide:260}); noise({d:.1,g:.02,delay:.02,hp:1200}); },
    attack(){ tone({f:150,d:.1,type:'square',g:.04,slide:-70}); noise({d:.08,g:.04,hp:600}); },
    hit(){ noise({d:.12,g:.06,hp:500}); tone({f:90,d:.12,type:'sine',g:.05,slide:-30}); },
    herohit(){ tone({f:70,d:.22,type:'sine',g:.07,slide:-20}); noise({d:.18,g:.05,hp:300}); },
    freeze(){ tone({f:1200,d:.18,type:'sine',g:.03,slide:-700}); },
    heal(){ tone({f:520,d:.16,type:'sine',g:.035,slide:260}); tone({f:780,d:.14,type:'sine',g:.028,delay:.07}); },
    buff(){ tone({f:440,d:.1,type:'triangle',g:.035,slide:220}); tone({f:660,d:.1,type:'triangle',g:.03,delay:.06}); },
    power(){ [0,1,2].forEach(i=>tone({f:380+i*120,d:.1,type:'triangle',g:.035,delay:i*.05})); },
    combat(){ tone({f:160,d:.3,type:'sawtooth',g:.05,slide:120}); tone({f:240,d:.3,type:'triangle',g:.03,delay:.06}); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone({f,d:.22,type:'triangle',g:.05,delay:i*.12})); },
    lose(){ [392,330,262,196].forEach((f,i)=>tone({f,d:.26,type:'sine',g:.05,delay:i*.13})); },
  };
  // ================= MUSIC: multi-track step sequencer =================
  let musicGain=null, schedTimer=null, curStep=0, nextNoteTime=0, track=null, trackName='';
  const NF=(function(){ const m={}, nm=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    for(let o=1;o<=6;o++) for(let i=0;i<12;i++){ const midi=(o+1)*12+i; m[nm[i]+o]=440*Math.pow(2,(midi-69)/12); } return m; })();
  function ensureMusic(){ const c=C(); if(!musicGain){ musicGain=c.createGain(); musicGain.gain.value=0.5; musicGain.connect(master); } return c; }

  function mkick(t){ const c=C(),o=c.createOscillator(),a=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(46,t+.12);
    a.gain.setValueAtTime(.0001,t); a.gain.exponentialRampToValueAtTime(muted?.0001:.17,t+.006); a.gain.exponentialRampToValueAtTime(.0001,t+.19);
    o.connect(a).connect(musicGain); o.start(t); o.stop(t+.2); }
  function mnoise(t,d,g,hp){ const c=C(),n=c.createBufferSource(),b=c.createBuffer(1,Math.ceil(c.sampleRate*d),c.sampleRate),dt=b.getChannelData(0);
    for(let i=0;i<dt.length;i++) dt[i]=(Math.random()*2-1)*(1-i/dt.length); n.buffer=b;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const a=c.createGain();
    a.gain.setValueAtTime(muted?.0001:g,t); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    n.connect(f).connect(a).connect(musicGain); n.start(t); n.stop(t+d); }
  function msnare(t){ mnoise(t,.16,.06,1500); const c=C(),o=c.createOscillator(),a=c.createGain();
    o.type='triangle'; o.frequency.value=190; a.gain.setValueAtTime(muted?.0001:.05,t); a.gain.exponentialRampToValueAtTime(.0001,t+.12);
    o.connect(a).connect(musicGain); o.start(t); o.stop(t+.13); }
  function mhat(t,open){ mnoise(t, open?.13:.045, .026, 7200); }
  function mvoice(f,t,d,g,type,cut){ const c=C(),o=c.createOscillator(),a=c.createGain(); o.type=type||'triangle'; o.frequency.value=f;
    let node=o; if(cut){ const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=cut; o.connect(fl); node=fl; }
    a.gain.setValueAtTime(.0001,t); a.gain.exponentialRampToValueAtTime(muted?.0001:g,t+.02); a.gain.exponentialRampToValueAtTime(.0001,t+d);
    node.connect(a).connect(musicGain); o.start(t); o.stop(t+d+.05); }

  function CH(root, a,b,c){ return {root:NF[root], tones:[NF[a],NF[b],NF[c]]}; }
  // Tracks. drum/bass/stab patterns are 16-step strings ('x' = hit). lead = [absStep, note, durSteps].
  const TRACKS={
    menu:{ bpm:88,
      chords:[CH('A2','A3','C4','E4'),CH('A2','A3','C4','E4'),CH('F2','F3','A3','C4'),CH('C3','C4','E4','G4'),
              CH('G2','G3','B3','D4'),CH('A2','A3','C4','E4'),CH('F2','F3','A3','C4'),CH('G2','G3','B3','D4')],
      kick:'x.......x.......', snare:'................', hat:'....x.......x...', bass:'x.......x.......',
      stab:'', pad:true, arp:[0,1,2,1,0,2,1,2], arpG:.022, leadG:.045,
      lead:[[0,'E4',6],[6,'A4',4],[12,'C5',4],[24,'B4',6],[32,'A4',8],[48,'G4',4],[54,'E4',6],
            [64,'A4',4],[72,'C5',4],[80,'E5',8],[96,'D5',6],[104,'C5',4],[112,'B4',8],[120,'A4',8]] },
    clash:{ bpm:126,
      chords:[CH('A2','A3','C4','E4'),CH('A2','A3','C4','E4'),CH('F2','F3','A3','C4'),CH('G2','G3','B3','D4'),
              CH('C3','C4','E4','G4'),CH('C3','C4','E4','G4'),CH('D3','D4','F4','A4'),CH('E2','E3','G#3','B3')],
      kick:'x...x...x...x...', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.x.', bass:'x..x..x.x..x..x.',
      stab:'..x...x...x...x.', pad:false, arp:null, stabG:.03, leadG:.05,
      lead:[[0,'A4',2],[2,'C5',2],[4,'E5',4],[12,'D5',4],[16,'C5',2],[18,'A4',2],[20,'C5',4],[28,'B4',4],
            [32,'G4',2],[34,'B4',2],[36,'D5',4],[44,'E5',4],[64,'E5',2],[66,'D5',2],[68,'C5',4],[76,'A4',4],
            [80,'D5',6],[88,'F5',4],[96,'E5',2],[98,'C5',2],[100,'A4',4],[112,'E5',4],[120,'A4',8]] },
    onslaught:{ bpm:134,
      chords:[CH('D3','D4','F4','A4'),CH('D3','D4','F4','A4'),CH('A#2','A#3','D4','F4'),CH('F2','F3','A3','C4'),
              CH('C3','C4','E4','G4'),CH('D3','D4','F4','A4'),CH('G2','G3','A#3','D4'),CH('A2','A3','C#4','E4')],
      kick:'x..x..x.x..x..x.', snare:'....x.......x...', hat:'x.x.x.x.x.x.x.x.', bass:'x.xx..x.x.xx..x.',
      stab:'x.......x.......', pad:false, arp:[0,1,2,1], arpG:.02, stabG:.028, leadG:.05,
      lead:[[0,'D5',4],[4,'F5',2],[6,'E5',2],[8,'D5',4],[16,'A4',6],[24,'D5',4],[32,'F5',4],[40,'G5',4],
            [48,'F5',2],[50,'E5',2],[52,'D5',4],[64,'A5',4],[72,'F5',4],[80,'G5',6],[88,'E5',4],
            [96,'F5',4],[104,'D5',4],[112,'A4',4],[116,'D5',4],[120,'D5',8]] }
  };
  function prepTrack(tr){
    if(tr._leadAt) return tr;
    tr._leadAt={}; tr.loopSteps=tr.chords.length*16;
    for(const [s,n,d] of tr.lead) tr._leadAt[s]={f:NF[n], d};
    return tr;
  }
  function playStep(tr, step, s16){
    const t=nextNoteTime;
    const ls=tr.loopSteps, ps=((step%ls)+ls)%ls, sib=step%16, bar=Math.floor(ps/16)%tr.chords.length;
    const ch=tr.chords[bar];
    if(tr.kick[sib]==='x') mkick(t);
    if(tr.snare[sib]==='x') msnare(t);
    if(tr.hat && tr.hat[sib]==='x') mhat(t, sib%8===4);
    if(tr.bass[sib]==='x') mvoice(ch.root, t, .2, .12, 'square', 420);
    if(tr.stab && tr.stab[sib]==='x') ch.tones.forEach(f=> mvoice(f, t, .16, tr.stabG||.028, 'sawtooth', 1700));
    if(tr.pad && sib===0) ch.tones.forEach(f=> mvoice(f, t, 16*s16*0.98, .015, 'sine', 1100));
    if(tr.arp && sib%2===0){ const ai=(ps/2)%tr.arp.length|0; const idx=tr.arp[ai]; const f=ch.tones[idx%3]*(idx>=3?2:1); mvoice(f, t, s16*1.6, tr.arpG||.02, 'triangle', 2600); }
    const ev=tr._leadAt[ps]; if(ev) mvoice(ev.f, t, ev.d*s16*0.95, tr.leadG||.045, 'triangle', 3200);
  }
  function scheduler(){
    const c=C(); if(!track) return;
    if(muted || c.state!=='running'){ nextNoteTime=c.currentTime+0.05; return; }
    const s16=(60/track.bpm)/4;
    while(nextNoteTime < c.currentTime+0.13){ playStep(track, curStep, s16); curStep++; nextNoteTime+=s16; }
  }
  function playMusic(name){
    ensureMusic();
    const tr=prepTrack(TRACKS[name]||TRACKS.menu);
    if(track===tr) return;                      // already playing this track
    track=tr; trackName=name; curStep=0; nextNoteTime=C().currentTime+0.1;
    if(!schedTimer) schedTimer=setInterval(scheduler, 25);
  }
  const BATTLE=['clash','onslaught'];
  function startPad(){ playMusic('menu'); }     // kept for compatibility
  return {
    start(){ if(started)return; started=true; const c=C(); if(c.state==='suspended')c.resume(); playMusic('menu'); },
    music(name){ const c=C(); if(c.state==='suspended')c.resume(); playMusic(name==='battle'?BATTLE[Math.floor(Math.random()*BATTLE.length)]:name); },
    sfx(n){ if(sfx[n]) sfx[n](); },
    toggle(){ muted=!muted; return muted; },
    isMuted(){ return muted; }
  };
})();

/* ====================== FX ====================== */
const fx=(function(){
  const bg=$('#bg'), cv=$('#fx'); let bgx,cx, W,H2,DPR;
  let parts=[], motes=[];
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H2=innerHeight;
    for(const c of [bg,cv]){ c.width=W*DPR; c.height=H2*DPR; }
    bgx=bg.getContext('2d'); cx=cv.getContext('2d'); bgx.setTransform(DPR,0,0,DPR,0,0); cx.setTransform(DPR,0,0,DPR,0,0);
  }
  function initMotes(){ motes=[]; for(let i=0;i<46;i++) motes.push({x:Math.random()*W,y:Math.random()*H2,r:Math.random()*2.4+.6,s:Math.random()*.4+.12,a:Math.random()*.5+.2,h:200+Math.random()*120}); }
  function loop(){
    // bg
    bgx.clearRect(0,0,W,H2);
    for(const m of motes){ m.y-=m.s; if(m.y<-6){ m.y=H2+6; m.x=Math.random()*W; }
      bgx.beginPath(); bgx.fillStyle=`hsla(${m.h} 90% 70% / ${m.a})`; bgx.arc(m.x,m.y,m.r,0,7); bgx.fill(); }
    // fx particles
    cx.clearRect(0,0,W,H2);
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life--; 
      if(p.kind==='proj'){ p.t+=p.sp; const x=p.x+(p.tx-p.x)*p.t, y=p.y+(p.ty-p.y)*p.t;
        cx.beginPath(); cx.fillStyle=p.color; cx.shadowBlur=14; cx.shadowColor=p.color; cx.arc(x,y,p.r,0,7); cx.fill(); cx.shadowBlur=0;
        if(p.t>=1){ burst(p.tx,p.ty,p.color,10,2.5); p.onHit&&p.onHit(); parts.splice(i,1); } continue; }
      if(p.kind==='ring'){ const k=1-p.life/p.max; cx.beginPath(); cx.strokeStyle=p.color; cx.globalAlpha=1-k; cx.lineWidth=3*(1-k)+1; cx.arc(p.x,p.y,p.r0+p.grow*k,0,7); cx.stroke(); cx.globalAlpha=1; if(p.life<=0)parts.splice(i,1); continue; }
      p.vy+=p.g||0; p.x+=p.vx; p.y+=p.vy; const al=clamp(p.life/p.max,0,1);
      cx.globalAlpha=al; cx.fillStyle=p.color; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); cx.globalAlpha=1;
      if(p.life<=0) parts.splice(i,1);
    }
    requestAnimationFrame(loop);
  }
  function burst(x,y,color,n=14,spd=3){ if(reduceMotion)n=Math.min(n,5); for(let i=0;i<n;i++){ const a=Math.random()*7, s=Math.random()*spd+1; parts.push({kind:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:.12,r:Math.random()*2.4+1,color,life:30,max:30}); } }
  function ring(x,y,color,grow=40){ parts.push({kind:'ring',x,y,r0:6,grow,color,life:22,max:22}); }
  function projectile(x,y,tx,ty,color,onHit){ if(reduceMotion){ onHit&&onHit(); burst(tx,ty,color,8,2.5); return; } parts.push({kind:'proj',x,y,tx,ty,t:0,sp:.09,r:5,color,onHit}); }
  function confetti(){ const cs=['#ffd05a','#3fe0d0','#57c8ff','#ff7a59','#b388ff','#6fe27a']; for(let i=0;i<140;i++){ parts.push({kind:'spark',x:W/2+(Math.random()-.5)*200,y:H2*0.38,vx:(Math.random()-.5)*9,vy:Math.random()*-9-2,g:.22,r:Math.random()*3+2,color:cs[i%cs.length],life:90,max:90}); } }
  // screen shake
  const shakeEl=$('#shake'); let shakeAmt=0;
  function shake(a=8){ if(reduceMotion)return; shakeAmt=Math.max(shakeAmt,a); if(!shaking) doShake(); }
  let shaking=false;
  function doShake(){ shaking=true; const step=()=>{ if(shakeAmt<.4){ shakeEl.style.transform=''; shaking=false; return; } shakeEl.style.transform=`translate(${(Math.random()-.5)*shakeAmt}px,${(Math.random()-.5)*shakeAmt}px)`; shakeAmt*=.85; requestAnimationFrame(step); }; step(); }
  // damage numbers
  function floatNum(x,y,text,cls='d-hp'){ const d=el('div','dmg '+cls,text); d.style.left=x+'px'; d.style.top=y+'px'; $('#fxdom').appendChild(d); d.addEventListener('animationend',()=>d.remove()); }
  function center(elm){ const r=elm.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, r}; }
  window.addEventListener('resize',()=>{ resize(); initMotes(); });
  resize(); initMotes(); requestAnimationFrame(loop);
  return { burst, ring, projectile, confetti, shake, floatNum, center };
})();

let customDeck=null;                 // committed human deck (array of card ids) or null for auto
let builder={hero:null, counts:{}};
const DECK_SIZE=40;
function copyLimit(c){ return 4; }   // up to 4 copies of any individual card
function poolForHero(heroId){
  const hero=getHero(heroId), facs=new Set([...hero.facs,'prism']);
  return Object.values(CARDS)
    .filter(c=>c.fac!=='super' && facs.has(c.fac))
    .sort((a,b)=> (a.cost-b.cost) || a.name.localeCompare(b.name));
}
function builderTotal(){ return Object.values(builder.counts).reduce((s,n)=>s+n,0); }
function builderList(){ const l=[]; for(const id in builder.counts) for(let i=0;i<builder.counts[id];i++) l.push(id); return l; }
function openDeckbuilder(heroId){
  builder={hero:heroId, counts:{}};
  dbFilters={search:'', cost:'all', fac:'all', type:'all', kw:'all', rar:'all', sort:'cost'};
  renderDeckbuilder();
  setScreen('deck');

// Filter / sort state for the collection grid
let dbFilters={search:'', cost:'all', fac:'all', type:'all', kw:'all', rar:'all', sort:'cost'};
const DB_KEYWORDS=['Frenzy','Deadly','Double Strike','Strikethrough','Lifesteal','Armored','Rage','Stun','Last Breath'];
const DB_FACS=[['ember','Ember'],['dawn','Dawn'],['flux','Flux'],['null','Null'],['sky','Sky'],['prism','Prism']];

function cardMatchesFilters(c){
  const f=dbFilters;
  if(f.search){ const q=f.search.toLowerCase(); if(!(c.name.toLowerCase().includes(q) || (c.text||'').toLowerCase().includes(q) || (c.kw||[]).join(' ').toLowerCase().includes(q))) return false; }
  if(f.cost!=='all'){ if(f.cost==='7'){ if(c.cost<7) return false; } else if(c.cost!==+f.cost) return false; }
  if(f.fac!=='all' && c.fac!==f.fac) return false;
  if(f.type!=='all' && c.type!==f.type) return false;
  if(f.kw!=='all' && !(c.kw&&c.kw.includes(f.kw))) return false;
  if(f.rar!=='all' && c.rar!==f.rar) return false;
  return true;
}
function sortedFilteredPool(){
  const pool=poolForHero(builder.hero).filter(cardMatchesFilters);
  const s=dbFilters.sort;
  const RAR={Common:0,Rare:1,Epic:2,Legendary:3};
  pool.sort((a,b)=>{
    if(s==='name') return a.name.localeCompare(b.name);
    if(s==='atk') return (b.atk||0)-(a.atk||0) || a.cost-b.cost;
    if(s==='rarity') return RAR[b.rar]-RAR[a.rar] || a.cost-b.cost;
    if(s==='faction') return a.fac.localeCompare(b.fac) || a.cost-b.cost;
    return (a.cost-b.cost) || a.name.localeCompare(b.name); // default: cost
  });
  return pool;
}
function dbGridCard(c){
  const n=builder.counts[c.id]||0;
  const maxed=n>=copyLimit(c);
  const kwLine = (c.kw&&c.kw.length) ? c.kw.join(' · ') : (c.type==='spell'? (c.text||'Spell') : 'No ability');
  const stat = c.type==='unit' ? `<span class="gc-atk">${c.atk}</span><span class="gc-hp">${c.hp}</span>` : `<span class="gc-spell">SPELL</span>`;
  return `<button class="gcard rar-${c.rar.toLowerCase()} ${maxed?'maxed':''} ${n?'owned':''}" data-id="${c.id}" style="--hue:${H[c.fac]}" title="${c.name}">
    <span class="gc-cost">${c.cost}</span>
    ${n?`<span class="gc-count">${n}</span>`:''}
    <span class="gc-art">${creature(c.shape,H[c.fac])}</span>
    <span class="gc-name">${c.name}</span>
    <span class="gc-kw">${kwLine}</span>
    <span class="gc-stats">${stat}</span>
  </button>`;
}
function costCurveHtml(){
  // buckets 1..6 and 7+ (group high costs)
  const buckets={}; let max=1;
  for(const id in builder.counts){ const c=getCard(id), b=Math.min(7,c.cost||0)||0; if(b<1) continue; buckets[b]=(buckets[b]||0)+builder.counts[id]; }
  for(const k in buckets) max=Math.max(max,buckets[k]);
  const labels=[1,2,3,4,5,6,7];
  return `<div class="curve">${labels.map(b=>{
    const v=buckets[b]||0; const h=Math.round((v/max)*100);
    return `<div class="curve-col"><span class="curve-bar" style="height:${v?Math.max(8,h):2}%"></span><span class="curve-n">${v||''}</span><span class="curve-x">${b===7?'7+':b}</span></div>`;
  }).join('')}</div>`;
}
function facBreakdownHtml(){
  const tally={}; let tot=0;
  for(const id in builder.counts){ const c=getCard(id); tally[c.fac]=(tally[c.fac]||0)+builder.counts[id]; tot+=builder.counts[id]; }
  if(!tot) return `<div class="facbar empty"></div>`;
  const order=['ember','dawn','flux','null','sky','prism'];
  const seg=order.filter(f=>tally[f]).map(f=>`<span class="facseg" style="--fc:${H[f]}; flex:${tally[f]}" title="${facName(f)} ${tally[f]}"></span>`).join('');
  const legend=order.filter(f=>tally[f]).map(f=>`<span class="faclg"><i style="background:hsl(${H[f]},70%,55%)"></i>${facName(f)} ${tally[f]}</span>`).join('');
  return `<div class="facbar">${seg}</div><div class="faclegend">${legend}</div>`;
}
function renderDeckbuilder(){
  const hero=getHero(builder.hero), total=builderTotal();
  const pool=sortedFilteredPool();

  const opt=(val,cur,label)=>`<option value="${val}" ${val===cur?'selected':''}>${label}</option>`;

  dom.deck.innerHTML = `
    <div class="db2" style="--hue:${hero.hue}">
      <div class="db2-top">
        <button class="iconbtn back" id="db-back">‹</button>

        <select class="db-sel" id="db-cost">${opt('all',dbFilters.cost,'Any cost')}${[1,2,3,4,5,6].map(n=>opt(String(n),dbFilters.cost,n+' cost')).join('')}${opt('7',dbFilters.cost,'7+ cost')}</select>
        <select class="db-sel" id="db-fac">${opt('all',dbFilters.fac,'All factions')}${DB_FACS.map(([v,l])=>opt(v,dbFilters.fac,l)).join('')}</select>
        <select class="db-sel" id="db-type">${opt('all',dbFilters.type,'All types')}${opt('unit',dbFilters.type,'Units')}${opt('spell',dbFilters.type,'Tricks')}</select>
        <select class="db-sel" id="db-kw">${opt('all',dbFilters.kw,'Any keyword')}${DB_KEYWORDS.map(k=>opt(k,dbFilters.kw,k)).join('')}</select>
        <select class="db-sel" id="db-rar">${opt('all',dbFilters.rar,'Any rarity')}${['Common','Rare','Epic','Legendary'].map(r=>opt(r,dbFilters.rar,r)).join('')}</select>
        <select class="db-sel" id="db-sort">${opt('cost',dbFilters.sort,'Sort: Cost')}${opt('name',dbFilters.sort,'Sort: Name')}${opt('atk',dbFilters.sort,'Sort: Attack')}${opt('rarity',dbFilters.sort,'Sort: Rarity')}${opt('faction',dbFilters.sort,'Sort: Faction')}</select>
      </div>
      <div class="db2-body">

        <aside class="db2-side">
          <div class="dbs-hero" style="--hue:${hero.hue}">

            <div class="dbs-hinfo">
              <div class="dbs-hname">${hero.name}</div>
              <div class="dbs-hfac">${hero.facs.map(f=>`<span class="fac-chip" style="--fc:${H[f]}">${facName(f)}</span>`).join('')}<span class="fac-chip" style="--fc:${H.prism}">Prism</span></div>
              <div class="dbs-hpow"><b>${hero.power.name}</b> · ${hero.power.cost}⚡ — ${hero.power.text}</div>
            </div>
          </div>
          <div class="dbs-count ${total===DECK_SIZE?'ok':''}"><span>${total} / ${DECK_SIZE}</span><small>${total===DECK_SIZE?'Ready':'cards'}</small></div>
          <div class="dbs-stats">
            <div class="dbs-lbl">COST CURVE</div>
            ${costCurveHtml()}

            ${facBreakdownHtml()}
          </div>
          <div class="dbs-decklbl">DECK <span>${total}</span></div>
          <div class="dbs-deck">${deckRows}</div>
          <div class="dbs-actions">
            <button class="btn ghost" id="db-clear">Clear</button>
            <button class="btn ghost" id="db-auto">Auto-fill</button>
            <button class="btn ghost" id="db-save" ${total===DECK_SIZE?'':'disabled'}>Save</button>
            <button class="btn primary" id="db-battle" ${total===DECK_SIZE?'':'disabled'}>Battle ⚔</button>
          </div>
        </aside>
      </div>
    </div>`;

  // toolbar wiring
  const sb=dom.deck.querySelector('#db-search');
  sb.addEventListener('input', e=>{ dbFilters.search=e.target.value; refreshGrid(); });
  const selMap={'#db-cost':'cost','#db-fac':'fac','#db-type':'type','#db-kw':'kw','#db-rar':'rar','#db-sort':'sort'};
  for(const sel in selMap){ dom.deck.querySelector(sel).addEventListener('change', e=>{ dbFilters[selMap[sel]]=e.target.value; refreshGrid(); }); }
  // hero switch (cycle) — keeps current deck if compatible, else warns
  dom.deck.querySelector('#db-herobtn').onclick=()=>{
    const idx=HEROES.findIndex(h=>h.id===builder.hero);
    const next=HEROES[(idx+1)%HEROES.length];

  };
  // actions
  dom.deck.querySelector('#db-back').onclick=()=>{ audio.sfx('ui'); (onlineMode?openFriendSetup():openSetup()); };
  dom.deck.querySelector('#db-clear').onclick=()=>{ audio.sfx('ui'); builder.counts={}; renderDeckbuilder(); };
  dom.deck.querySelector('#db-auto').onclick=()=>{ audio.sfx('select'); autofillDeck(); renderDeckbuilder(); };
  dom.deck.querySelector('#db-save').onclick=()=>{
    if(builderTotal()!==DECK_SIZE) return;

    savedDecks.push(deck); selectedHeroId=builder.hero; selectedDeckId=deck.id;

  };
  dom.deck.querySelector('#db-battle').onclick=()=>{

  };

    const b=e.target.closest('.gcard'); if(!b) return; addToDeck(b.dataset.id);
  });
  dom.deck.querySelector('.dbs-deck').addEventListener('click', e=>{
    const minus=e.target.closest('.dr-minus'), plus=e.target.closest('.dr-plus');
    if(minus) removeFromDeck(minus.dataset.id);
    else if(plus) addToDeck(plus.dataset.id);
  });
}
function confirmHeroSwitchOk(heroId){
  const facs=new Set([...getHero(heroId).facs,'prism']);
  for(const id in builder.counts){ if(!facs.has(getCard(id).fac)) return false; }
  return true;
}
// Re-render just the grid + side stats without rebuilding the toolbar (keeps focus in search).
function refreshGrid(){
  const pool=sortedFilteredPool();
  const gridEl=dom.deck.querySelector('.db2-grid');
  if(gridEl) gridEl.innerHTML = pool.length ? pool.map(dbGridCard).join('') : `<div class="grid-empty">No cards match these filters.</div>`;
}
function addToDeck(id){
  const c=getCard(id); const n=builder.counts[id]||0;
  if(builderTotal()>=DECK_SIZE){ toast('Deck is full ('+DECK_SIZE+').'); return; }
  if(n>=copyLimit(c)){ toast('Max '+copyLimit(c)+' of '+c.name+'.'); return; }
  builder.counts[id]=n+1; audio.sfx('select'); renderDeckbuilder();
}
function removeFromDeck(id){
  if(!builder.counts[id]) return;
  builder.counts[id]--; if(builder.counts[id]<=0) delete builder.counts[id];
  audio.sfx('ui'); renderDeckbuilder();
}
function autofillDeck(){
  const pool=poolForHero(builder.hero);
  let guard=0;
  while(builderTotal()<DECK_SIZE && guard++<500){
    const options=pool.filter(c=>(builder.counts[c.id]||0)<copyLimit(c));
    if(!options.length) break;
    const c=options[Math.floor(Math.random()*options.length)];
    builder.counts[c.id]=(builder.counts[c.id]||0)+1;
  }
}

/* ---- units ---- */
function buildUnitEl(u){
  const e=el('div','unit'); e.dataset.uid=u.uid; e.style.setProperty('--hue',u.hue);
  e.innerHTML=`
    <div class="art">${creature(u.shape,u.hue)}</div>
    <div class="uname">${u.name}</div>
    <div class="kw">${kwPips(u.keywords)}</div>
    ${statEl('atk',u.attack)}${statEl('hp',u.health)}
    <div class="badge"></div>
    <div class="frost"></div>
    <div class="shield-ring"></div>`;
  e.querySelector('.art').style.animationDelay = (-Math.random()*2.7).toFixed(2)+'s';
  decorateUnit(e,u);
  return e;
}
function spawnUnit(slot, u){
  const e=buildUnitEl(u); slot.appendChild(e); slot.classList.remove('empty');
  audio.sfx('summon');
  if(!reduceMotion) requestAnimationFrame(()=>{ const c=fx.center(e); fx.burst(c.x, c.y+34, '#c9a878', 9, 2.2); fx.ring(c.x, c.y+34, 'rgba(210,190,150,.7)', 26); });
  return e;
}
function decorateUnit(e,u){
  const card=getCard(u.cardId);
  const atk=e.querySelector('.stat.atk'), hp=e.querySelector('.stat.hp');
  atk.querySelector('span').textContent=u.attack;
  hp.querySelector('span').textContent=u.health;
  atk.classList.toggle('buffed', u.attack>(card.atk||0));
  hp.classList.toggle('hurt', u.health<u.maxHealth);
  hp.classList.toggle('buffed', u.maxHealth>(card.hp||0) && u.health>=u.maxHealth);
  e.querySelector('.kw').innerHTML=kwPips(u.keywords);
  e.classList.toggle('shielded', !!u.shield);
  e.querySelector('.frost').style.display = u.frozen?'block':'none';
}
function unitElByUid(uid){ return dom.board.querySelector(`.unit[data-uid="${uid}"]`); }

function syncBoard(){
  for(let i=0;i<5;i++){
    const lane=dom.board.querySelector(`.lane[data-lane="${i}"]`);
    // env tag
    const tag=lane.querySelector('.env-tag');
    if(state.board[i].env){ tag.hidden=false; tag.textContent=state.board[i].env.label||'Env'; lane.classList.add('env-on'); }
    else { tag.hidden=true; lane.classList.remove('env-on'); }
    for(const side of [0,1]){
      const slot=lane.querySelector(`.slot[data-side="${side}"]`);
      const u=state.board[i].units[side];
      const existing=slot.querySelector('.unit');
      if(u && u.alive){
        if(existing && existing.dataset.uid==String(u.uid)){ decorateUnit(existing,u); slot.classList.remove('empty'); }
        else {
          if(existing){ killEl(existing); }
          spawnUnit(slot, u);
        }
      } else {
        if(existing) killEl(existing);
        slot.classList.add('empty');
      }
    }
  }
}
function killEl(e){
  if(e.classList.contains('dying')) return;
  e.classList.add('dying');
  e.addEventListener('animationend',()=>e.remove(),{once:true});
  setTimeout(()=>{ if(e.parentNode) e.remove(); }, 520);
}

function buildCardEl(inst){

function renderHand(){

function allowedInPhase(inst, c){

  if(c.type==='unit') return phaseMode==='main';  // fighters only during setup

}

function updateEnergyPips(){

/* ====================== CONTROL ====================== */
function cardNeedsTarget(c){
  if(c.type==='unit') return true;
  return !!(c.eff && c.eff.placement==='lane');
}
function validLanesFor(c, side){
  if(c.type==='unit') return targetLanes(side,{kind:'place'});
  if(c.eff && c.eff.placement==='lane') return targetLanes(side, c.eff);
  return [];
}
function firstPlayerThisRound(){ return (state.round % 2 === 1) ? 0 : 1; }

/* ---- fx playback ---- */
function ensureUnitEl(uid){
  let e=unitElByUid(uid); if(e) return e;

  for(let i=0;i<5;i++) for(const side of [0,1]){

function crystalCenter(side){ return fx.center(dom.hpEl[side]); }

function flinch(side){ const p=dom.portrait[side]; if(!p) return; p.classList.remove('flinch'); void p.offsetWidth; p.classList.add('flinch'); }
function grin(side){ const p=dom.portrait[side]; if(!p) return; p.classList.remove('grin'); void p.offsetWidth; p.classList.add('grin'); }
function goldFlash(){ if(!dom.flash||reduceMotion) return; dom.flash.classList.remove('on'); void dom.flash.offsetWidth; dom.flash.classList.add('on'); }
function superPowerFx(side, cardId){

}
function hitHero(side, amt){

  fx.floatNum(cz.x, cz.y-10, '-'+amt, 'd-hp');

  fx.floatNum(cz.x, cz.y-10, '+'+amt, 'd-heal');

}
function hitUnitFx(uid, amt){
  const e=ensureUnitEl(uid)||unitElByUid(uid); if(!e) return;
  const cz=fx.center(e);
  e.classList.add('hitflash'); setTimeout(()=>e.classList.remove('hitflash'),280);
  fx.floatNum(cz.x, cz.y-8, '-'+amt, 'd-hp'); fx.burst(cz.x,cz.y,'#ffcf7a',10,2.6);
}
async function playFx(list, opts={}){
  if(!list||!list.length){ if(!opts.noSync){ syncBoard(); updateHud(); renderLog(); } return; }
  for(const f of list){
    switch(f.type){
      case 'summon': ensureUnitEl(f.uid); break;
      case 'cast': { audio.sfx('card'); const lane=dom.board.querySelector(`.lane[data-lane="${f.lane}"]`); if(lane){ const cz=fx.center(lane); fx.ring(cz.x,cz.y,'#9fd8ff',46); } break; }
      case 'unitDmg': if(f.amt>0){ hitUnitFx(f.uid,f.amt); audio.sfx('hit'); } else { const e=unitElByUid(f.uid); if(e) decorateUnitByUid(f.uid); } break;
      case 'heroDmg': if(f.amt>0) hitHero(f.side,f.amt); break;
      case 'superpower': superPowerFx(f.side, f.cardId); break;
      case 'kill': grin(f.side); break;
      case 'death': { const e=unitElByUid(f.uid); if(e){ const cz=fx.center(e); fx.burst(cz.x,cz.y,'#ff8a6b',16,3.2); fx.ring(cz.x,cz.y,'rgba(255,120,90,.6)',40); } break; }
      case 'heroHeal': if(f.amt>0) healHeroFx(f.side,f.amt); break;
      case 'shieldBreak': { const e=unitElByUid(f.uid); if(e){ const cz=fx.center(e); fx.ring(cz.x,cz.y,'#bff0ff',40); audio.sfx('freeze'); } break; }
      case 'freeze': { const e=ensureUnitEl(f.uid); if(e){ decorateUnitByUid(f.uid); const cz=fx.center(e); fx.ring(cz.x,cz.y,'#9fe9ff',36);} audio.sfx('freeze'); break; }
      case 'silence': decorateUnitByUid(f.uid); audio.sfx('ui'); break;
      case 'buff': { const e=ensureUnitEl(f.uid); if(e){ decorateUnitByUid(f.uid); const cz=fx.center(e); fx.floatNum(cz.x,cz.y-8,'▲','d-buff'); fx.ring(cz.x,cz.y,'#9fff8a',30);} audio.sfx('buff'); break; }
      case 'energy': break;
      case 'power': audio.sfx('power'); break;
      case 'draw': if(f.side===state.humanSide) audio.sfx('card'); break;
    }
    await delay(opts.fast?40:90);
  }
  if(!opts.noSync){ syncBoard(); updateHud(); renderLog(); }
}
function decorateUnitByUid(uid){
  const e=unitElByUid(uid); if(!e) return;
  for(let i=0;i<5;i++) for(const side of [0,1]){ const u=state.board[i].units[side]; if(u&&u.uid===uid){ decorateUnit(e,u); return; } }
}

/* ---- human input ---- */
let humanActive=false, selectedIid=null, powerArmed=false, endTurnResolve=null, phaseMode='full';
function wireMatchInput(){
  // Pointer-based interaction: a quick tap opens the info tooltip; a drag past a
  // small threshold enters placement mode with a follow-cursor ghost and live
  // lane snapping. Works for mouse and touch via Pointer Events.
  dom.hand.addEventListener('pointerdown', onHandPointerDown);
  dom.board.addEventListener('click', e=>{
    if(!humanActive) return;
    // Click-to-place still works as a fallback (after tapping a card to select).
    const li=laneFromEvent(e);
    if(li==null) return;
    onLaneClick(li);
  });
  dom.powerbtn.addEventListener('click', ()=>{ if(!humanActive) return; onPower(); });
  dom.endbtn.addEventListener('click', ()=>{ if(!humanActive) return; audio.sfx('ui'); if(onlineMode && online && online.session){ humanActive=false; updateHud(); clearSelection(); online.session.endPhase(); } else { resolvePhase(); } });
  dom.mutebtn.addEventListener('click', ()=>{ const m=audio.toggle(); dom.mutebtn.style.opacity=m?0.4:1; toast(m?'Muted':'Sound on'); });
  // dismiss tooltip when tapping anywhere that isn't a hand card
  document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#hand .card') && dom.cardtip && !dom.cardtip.hidden) hideTip(); }, true);
}
function clearHighlights(){ [...dom.board.querySelectorAll('.lane')].forEach(l=>l.classList.remove('target','bad','snap','blocked')); }

/* ===== Tap vs Drag interaction ===== */
let dragState=null;                 // {iid, card, startX, startY, dragging, validSet, srcEl}
const DRAG_THRESHOLD=8;             // px before a press becomes a drag
function hideTip(){ if(dom.cardtip){ dom.cardtip.hidden=true; } }
function showTipFor(iid, anchorEl){
  const inst=state.players[state.humanSide].hand.find(h=>h.iid===iid); if(!inst) return;
  const c=getCard(inst.cardId);
  const isUnit=c.type==='unit';
  const vanilla = isUnit && (!c.kw||!c.kw.length) && !c.eff;
  const kwHtml=(c.kw&&c.kw.length)? `<div class="tip-kw">${c.kw.map(k=>`<div class="tip-kwrow">${kwIcon(k)}<span><b>${k}</b> — ${KW_TEXT[k]||''}</span></div>`).join('')}</div>`
    : vanilla? `<div class="tip-kw"><div class="tip-kwrow" style="opacity:.7">No special ability — a straightforward fighter.</div></div>`:'';
  const statHtml=isUnit? `<div class="tip-stats"><span class="tip-stat" style="color:#ffd05a">${ICON.atkbg}&nbsp;${c.atk}</span><span class="tip-stat" style="color:#ff6b78">${ICON.hpbg}&nbsp;${c.hp}</span></div>`:'';
  const rar=(c.rar||'Common').toLowerCase();
  const typeLabel = c.super?'Superpower':isUnit?(vanilla?'Unit · Vanilla':'Unit'):'Trick / Spell';
  dom.cardtip.innerHTML=`
    <div class="tip-head">
      <span class="tip-cost">${ICON.cost}<span>${c.cost}</span></span>
      <span><div class="tip-name">${c.name}</div><div class="tip-type">${typeLabel}</div></span>
    </div>
    ${statHtml}${kwHtml}
    ${c.text?`<div class="tip-desc">${c.text}</div>`:''}
    <span class="tip-rar r-${rar}">${c.rar||'Common'}</span>`;
  dom.cardtip.hidden=false;
  // position above the card, clamped to viewport
  const r=anchorEl.getBoundingClientRect();
  const tw=dom.cardtip.offsetWidth, th=dom.cardtip.offsetHeight;
  let left=r.left+r.width/2-tw/2; left=Math.max(8, Math.min(window.innerWidth-tw-8, left));
  let top=r.top-th-12; if(top<8) top=r.bottom+12;
  dom.cardtip.style.left=left+'px'; dom.cardtip.style.top=top+'px';
}
function onHandPointerDown(e){
  if(!humanActive) return;
  const cardEl=e.target.closest('.card'); if(!cardEl) return;
  const iid=Number(cardEl.dataset.iid);
  const inst=state.players[state.humanSide].hand.find(h=>h.iid===iid); if(!inst) return;
  const c=getCard(inst.cardId);
  dragState={ iid, c, startX:e.clientX, startY:e.clientY, dragging:false, srcEl:cardEl, needsTarget:cardNeedsTarget(c) };
  window.addEventListener('pointermove', onHandPointerMove);
  window.addEventListener('pointerup', onHandPointerUp, {once:true});
}
function beginDrag(){
  const ds=dragState; if(!ds) return;
  // disallowed in this phase or unaffordable → fall back to a tooltip, no drag
  const inst=state.players[state.humanSide].hand.find(h=>h.iid===ds.iid);
  if(!inst || !allowedInPhase(inst,ds.c) || ds.c.cost>state.players[state.humanSide].energy){
    showTipFor(ds.iid, ds.srcEl); ds.blockedDrag=true; return;
  }
  ds.dragging=true; hideTip();
  dom.match.classList.add('dragging','selecting');
  ds.srcEl.classList.add('dragging');
  // build ghost
  const ghostCard=buildCardEl(inst); ghostCard.classList.add('playable');
  dom.dragghost.innerHTML=''; dom.dragghost.appendChild(ghostCard); dom.dragghost.hidden=false;
  // valid lanes (units: any empty own slot; targeted spells: their rule). null = global, no lane needed
  ds.validSet = ds.needsTarget ? new Set(validLanesFor(ds.c, state.humanSide)) : null;
  if(ds.needsTarget){ highlight([...(ds.validSet||[])]); markBlockedLanes(ds.validSet); }
  audio.sfx('select');
  positionGhost(ds.startX, ds.startY);
}
function markBlockedLanes(validSet){
  [...dom.board.querySelectorAll('.lane')].forEach(l=>{
    const li=Number(l.dataset.lane);
    if(!validSet.has(li)) l.classList.add('blocked');
  });
}
function positionGhost(x,y){ dom.dragghost.style.left=x+'px'; dom.dragghost.style.top=y+'px'; }
function onHandPointerMove(e){
  const ds=dragState; if(!ds) return;
  if(!ds.dragging && !ds.blockedDrag){
    const dx=e.clientX-ds.startX, dy=e.clientY-ds.startY;
    if(Math.hypot(dx,dy)>=DRAG_THRESHOLD) beginDrag();
  }
  if(ds.dragging){
    positionGhost(e.clientX, e.clientY);
    if(ds.needsTarget){
      const li=laneAtPoint(e.clientX, e.clientY);
      [...dom.board.querySelectorAll('.lane')].forEach(l=>l.classList.remove('snap'));
      if(li!=null && ds.validSet.has(li)){ const lane=dom.board.querySelector(`.lane[data-lane="${li}"]`); if(lane) lane.classList.add('snap'); }
    }
  }
}
function laneAtPoint(x,y){
  const lanes=[...dom.board.querySelectorAll('.lane')]; if(!lanes.length) return null;
  // only count it as "over the board" if within the board's vertical band
  const br=dom.board.getBoundingClientRect();
  if(br.height>0 && (y<br.top-40 || y>br.bottom+40)) return null;
  let best=Infinity, hit=null;
  for(const l of lanes){ const r=l.getBoundingClientRect(); const cx=(r.left+r.right)/2; const d=Math.abs(cx-x); if(d<best){ best=d; hit=Number(l.dataset.lane); } }
  return hit;
}
function endDrag(){
  window.removeEventListener('pointermove', onHandPointerMove);
  if(dragState){ if(dragState.srcEl) dragState.srcEl.classList.remove('dragging'); }
  dom.dragghost.hidden=true; dom.dragghost.innerHTML='';
  dom.match.classList.remove('dragging');
  [...dom.board.querySelectorAll('.lane')].forEach(l=>l.classList.remove('snap','blocked'));
}
function onHandPointerUp(e){
  const ds=dragState; if(!ds){ return; }
  if(!ds.dragging){
    // It was a tap, not a drag → toggle info tooltip AND arm for click-to-place.
    if(!ds.blockedDrag){
      if(selectedIid===ds.iid){ clearSelection(); }
      else { showTipFor(ds.iid, ds.srcEl); dom.cardtip.dataset.iid=String(ds.iid); onSelectCard(ds.iid); }
    }
    endDrag(); dragState=null; return;
  }
  // Drag release → attempt placement.
  if(!ds.needsTarget){
    endDrag(); clearHighlights(); dom.match.classList.remove('selecting');
    audio.sfx('select'); doPlay(ds.iid, null);
  } else {
    const li=laneAtPoint(e.clientX, e.clientY);
    endDrag();
    if(li!=null && ds.validSet.has(li)){ clearHighlights(); dom.match.classList.remove('selecting'); doPlay(ds.iid, li); }
    else { clearHighlights(); dom.match.classList.remove('selecting'); toast(li==null?'Drag onto a lane to play.':'That lane is occupied.'); }
  }
  dragState=null;
}

function laneFromEvent(e){
  // Resolve which lane column a click belongs to. Placement depends ONLY on the
  // player's own slot in that column — never on whether the enemy occupies it.
  const lanes=[...dom.board.querySelectorAll('.lane')];
  if(!lanes.length) return null;
  const probe=lanes[0].getBoundingClientRect();
  if(probe.width>0 || probe.height>0){
    // Nearest lane centre on the X axis. Lanes are ordered columns, so this stays
    // correct under the board's 3D perspective tilt — unlike rect containment,
    // whose projected boxes overlap and can mis-resolve to the wrong lane.
    const x=e.clientX;
    let best=Infinity, hit=null;
    for(const l of lanes){ const r=l.getBoundingClientRect(); const cx=(r.left+r.right)/2; const d=Math.abs(cx-x); if(d<best){ best=d; hit=Number(l.dataset.lane); } }
    if(hit!=null) return hit;
  }
  // Fallback (no layout, e.g. headless): the lane element under the pointer.
  const elx=e.target && e.target.closest && e.target.closest('.lane');
  return elx ? Number(elx.dataset.lane) : null;
}
function clearSelection(){ selectedIid=null; powerArmed=false; clearHighlights(); if(dom.match) dom.match.classList.remove('selecting'); hideTip(); renderHand(); }
function highlight(lanes){ clearHighlights(); const set=new Set(lanes); [...dom.board.querySelectorAll('.lane')].forEach(l=>{ if(set.has(Number(l.dataset.lane))) l.classList.add('target'); }); }

function onSelectCard(iid){

/* ---- combat (animation only — pure strike logic lives in the engine) ---- */
async function lunge(e, tx, ty){
  if(!e || reduceMotion) return;
  const c=fx.center(e);
  const dx=(tx-c.x)*0.42, dy=(ty-c.y)*0.42;
  e.classList.add('attack-lunge');
  e.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
}
function unlunge(e){ if(!e) return; e.style.transform=''; setTimeout(()=>e.classList.remove('attack-lunge'),160); }

// Animate + resolve a single strike as one readable beat: lunge in, impact,
// callout, apply damage, recoil. Damage was snapshotted before combat, so doing
// these one at a time doesn't change the math — it only paces the reveal.
async function playOneStrike(strike, side, targetEl){
  if(!strike) return;
  const SMACK=['SMACK!','POW!','WHAM!','BAM!','CRUNCH!','THWACK!'];
  const atkEl=unitElByUid(strike.attacker.uid);
  const dieTarget = strike.target==='unit' && strike.defender ? strike.defender : null;
  const tp = (strike.target==='unit' && targetEl) ? fx.center(targetEl) : crystalCenter(1-side);
  lunge(atkEl, tp.x, tp.y);
  await delay(reduceMotion?10:170);
  // impact — resolved authoritatively through the session, view animates the fx
  const res=session.dispatch({type:'applyStrike', strike, side});
  const cfx=res.fx;
  const killed = dieTarget && !dieTarget.alive;
  if(targetEl && strike.target==='unit'){ const c=fx.center(targetEl); calloutAt(c.x, c.y-6, killed?'K.O.!':SMACK[Math.floor(Math.random()*SMACK.length)], killed?'ko':''); }
  session.dispatch({type:'reap'});
  await playFx(cfx,{noSync:true,fast:true});
  unlunge(atkEl);
  syncBoard(); updateHud(); renderLog();
  await delay(reduceMotion?10:230);
}
async function resolveCombat(){
  controller.phaseLabel='CLASH'; updateHud();
  banner('Clash!'); audio.sfx('combat'); await delay(reduceMotion?40:520);
  for(let i=0;i<5;i++){
    // The session snapshots both strikes up front (simultaneity + Frenzy survival).
    const {sV, sR, V, R} = session.dispatch({type:'resolveLane', laneIndex:i}).strikes;
    const aV=state.board[i].units[V], aR=state.board[i].units[R];
    const laneEl=dom.board.querySelector(`.lane[data-lane="${i}"]`);
    if(!sV && !sR){ continue; }
    if(laneEl) laneEl.classList.add('clashing');
    await delay(reduceMotion?5:120);
    const eV=aV?unitElByUid(aV.uid):null, eR=aR?unitElByUid(aR.uid):null;
    await playOneStrike(sV, V, eR);
    if(checkWin()!=null){ if(laneEl) laneEl.classList.remove('clashing'); break; }
    await playOneStrike(sR, R, eV);
    if(laneEl) laneEl.classList.remove('clashing');
    if(checkWin()!=null) break;
    await delay(reduceMotion?5:180);
  }
  session.dispatch({type:'endCombat'});
  syncBoard(); updateHud();
  await delay(reduceMotion?40:360);
}

/* ---- main loop: asymmetric PvZH-style phases ----
   Vanguard commits fighters first (no tricks), Responder takes a full turn,
   then Vanguard gets a tricks-only window, then combat. */
async function runPhase(side, kind){
  controller.activeSide=side; updateHud();
  if(kind==='v-setup'){
    if(side===state.humanSide) await humanPhase('main','Your Setup','Pass to Rival  ▶');
    else { controller.phaseLabel='Rival Sets Up'; updateHud(); await aiTurn(side,{units:true,spells:false,power:true}); }
  } else if(kind==='r-full'){
    if(side===state.humanSide) await humanPhase('full','Your Turn','End Turn');
    else { controller.phaseLabel='Rival Responds'; updateHud(); await aiTurn(side,{units:true,spells:true,power:true}); }
  } else if(kind==='v-tricks'){
    if(side===state.humanSide) await humanPhase('tricks','Your Tricks','GO!  ⚔');
    else { controller.phaseLabel='Rival Tricks'; updateHud(); await aiTurn(side,{units:false,spells:true,power:false}); }
  }
}
async function runGame(){
  const V=state.vanguard, R=1-V;
  while(state.winner==null){
    const up=session.dispatch({type:'upkeep'});
    await playFx(up.fx);
    renderHand(); syncBoard(); updateHud(); renderLog();
    banner('Round '+state.round);
    await delay(820);
    if(checkWin()!=null) break;

    await runPhase(V,'v-setup');     // 1) Vanguard fighters (no tricks)
    if(state.winner!=null) break;
    await runPhase(R,'r-full');      // 2) Responder full turn
    if(state.winner!=null) break;
    await runPhase(V,'v-tricks');    // 3) Vanguard tricks
    if(state.winner!=null) break;

    await resolveCombat();           // 4) GO
    if(state.winner!=null) break;
    await delay(160);
  }
  finish();
}
function finish(){
  humanActive=false;
  const human=state.humanSide;
  const win = state.winner===human;
  const draw = state.winner==='draw';
  dom.result.className='result on '+(win?'win':'loss');
  dom.result.innerHTML=`
    <div class="panel">
      <h2>${draw?'DRAW':win?'VICTORY':'DEFEAT'}</h2>
      <p>${draw?'Both crystals shattered at once.':win?'You cracked the rival crystal. The rift bows to you.':'Your crystal shattered. Regroup and run it back.'}</p>
      <div class="rewards">
        <div class="rw"><b>+${win?80:25}</b><small>SHARDS</small></div>
        <div class="rw"><b>+${win?20:8}</b><small>XP</small></div>
      </div>
      <div class="ra">
        <button class="btn end" id="rematch">Run It Back</button>
        <button class="btn ghost" id="tomenu">Main Menu</button>
      </div>
    </div>`;
  dom.result.querySelector('#rematch').onclick=()=>{ audio.sfx('ui'); dom.result.className='result'; controller.startMatch(); };
  dom.result.querySelector('#tomenu').onclick=()=>{ audio.sfx('ui'); audio.music('menu'); dom.result.className='result'; renderMenu(); setScreen('menu'); };
  if(win){ fx.confetti(); audio.sfx('win'); } else { audio.sfx('lose'); }
}

/* ============================================================================
   SCRIPT D — PLAY A FRIEND (networked lobby + server-driven match controller)
   Presentation layer for online friend matches. Talks to the authoritative
   server through OnlineSession; the existing render primitives (buildMatchDOM,
   syncBoard, renderHand, playFx, updateHud) are reused — only the match LOOP
   differs (reactive to server messages instead of the local AI loop).
   ============================================================================ */

/* ---- OnlineSession: same Session interface, backed by the server ---- */
function makeOnlineSession(handlers){
  const on = handlers || {};
  const fire = (k,v)=>{ if(on[k]) on[k](v); };
  const url = (location.protocol==='https:'?'wss://':'ws://') + location.host;
  let ws=null, mySide=0, snap=null, code=null, queue=[], manualClose=false, retries=0;
  const J=(type,payload)=>JSON.stringify({type,payload});
  function flush(){ while(queue.length && ws && ws.readyState===1) ws.send(queue.shift()); }
  function out(type,payload){ const m=J(type,payload); if(ws && ws.readyState===1) ws.send(m); else queue.push(m); }
  function connect(){
    fire('connection','connecting');
    try { ws=new WebSocket(url); } catch(e){ fire('error','Could not connect.'); return; }
    ws.onopen=()=>{ retries=0; fire('connection','online'); if(code && snap) out('reconnect',{id:PID,code}); flush(); };
    ws.onclose=()=>{ if(manualClose) return; fire('connection','reconnecting'); const w=Math.min(1000*Math.pow(2,retries++),8000); setTimeout(connect,w); };
    ws.onerror=()=>{ fire('connection','error'); };
    ws.onmessage=(ev)=>{ let m; try{m=JSON.parse(ev.data);}catch{return;} const p=m.payload||{};
      if(p.snapshot) snap=p.snapshot;
      switch(m.type){
        case 'lobbyCreated': code=p.code; fire('lobbyCode',p.code); break;
        case 'lobbyJoined': code=p.code; fire('lobbyCode',p.code); break;
        case 'lobbyState': fire('lobby',p); break;
        case 'joinError': fire('joinError',p.error); break;
        case 'reconnectError': fire('joinError',p.error); break;
        case 'matchStart': mySide=p.side; fire('matchStart',p); break;
        case 'roundStart': fire('round',p); break;
        case 'phase': fire('phase',p); break;
        case 'fx': fire('fx',p); break;
        case 'combat': fire('combat',p); break;
        case 'matchEnd': fire('matchEnd',p); break;
        case 'error': fire('error',p.error); break;
        case 'opponentDisconnected': fire('connection','opponent-gone'); break;
        case 'opponentReconnected': fire('connection','opponent-back'); break;
        case 'opponentLeft': fire('connection','opponent-left'); break;
      }
    };
  }
  connect();
  return {
    kind:'online',
    get state(){ return snap; }, snapshot(){ return snap; },
    isBotTurn(){ return false; }, isHuman(side){ return side===mySide; }, mySide(){ return mySide; },
    dispatch(action){ out('action',action); return {ok:true,fx:[],pending:true}; },
    createLobby(){ out('createLobby',{id:PID,name:PNAME}); },
    joinLobby(c){ code=(c||'').toUpperCase().trim(); out('joinLobby',{id:PID,name:PNAME,code}); },
    setLoadout(heroId,deck){ out('setLoadout',{heroId,deck}); },
    ready(v){ out('ready',{ready:v!==false}); },
    endPhase(){ out('action',{type:'endPhase'}); },
    concede(){ out('action',{type:'concede'}); },
    roomCode(){ return code; },
    close(){ manualClose=true; if(ws) ws.close(); }
  };
}

  if(location.protocol==='file:'){ showNoServer(); return; }

  online = { session:null, role, deck, deckName: deckName||'Auto Deck', lobby:null, started:false, conn:'connecting' };
  online.session = makeOnlineSession(onlineHandlers());
